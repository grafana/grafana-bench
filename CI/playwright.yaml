run:
  stage: "ci"

test:
  type: "smoke"
  runner: "playwright"

suite:
  name: "grafana-bench/playwright-tests"
  base: "/tests/CI/playwright"

service:
  name: "grafana"
  url: "http://localhost:3000"
  admin:
    user: "admin"
    password: "admin"

pw:
  prepare: "yarn install; yarn playwright install"
  execute: "yarn run test"

log:
  level: DEBUG
