name: 'Setup Grafana Bench'
description: 'Install grafana-bench binary'
inputs:
  version:
    description: 'Version of grafana-bench to install (e.g., "v0.6.1")'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Install grafana-bench
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        echo "Installing grafana-bench version: $VERSION"
        
        # Determine platform and architecture
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        
        case $ARCH in
          x86_64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
          *) echo "Unsupported architecture: $ARCH" && exit 1 ;;
        esac
        
        case $OS in
          linux) PLATFORM="linux" ;;
          darwin) PLATFORM="darwin" ;;
          mingw*|msys*|cygwin*) PLATFORM="windows"; ARCH="${ARCH}.exe" ;;
          *) echo "Unsupported platform: $OS" && exit 1 ;;
        esac
        
        BINARY_NAME="grafana-bench-${PLATFORM}-${ARCH}"
        DOWNLOAD_URL="https://github.com/grafana/grafana-bench/releases/download/${VERSION}/${BINARY_NAME}"
        
        echo "Downloading from: $DOWNLOAD_URL"
        
        # Download and install binary
        if curl -fsSL "$DOWNLOAD_URL" -o grafana-bench; then
          chmod +x grafana-bench
          sudo mv grafana-bench /usr/local/bin/
          grafana-bench version
        else
          echo "Failed to download grafana-bench binary, falling back to go install"
          go install github.com/grafana/grafana-bench@${VERSION}
        fi