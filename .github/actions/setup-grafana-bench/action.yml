name: 'Setup Grafana Bench'
description: 'Install grafana-bench binary and setup Prometheus secrets'
inputs:
  version:
    description: 'Version of grafana-bench to install (e.g., "v0.6.1" or "latest"). Set to "false" to skip installation and only setup secrets.'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Download grafana-bench binary
      id: download
      if: inputs.version != 'false'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)

        case $ARCH in
          x86_64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
          *) echo "Unsupported architecture: $ARCH" && exit 1 ;;
        esac

        case $OS in
          linux) PLATFORM="linux" ;;
          darwin) PLATFORM="darwin" ;;
          mingw*|msys*|cygwin*) PLATFORM="windows"; ARCH="${ARCH}.exe" ;;
          *) echo "Unsupported platform: $OS" && exit 1 ;;
        esac

        BINARY_NAME="grafana-bench-${PLATFORM}-${ARCH}"
        echo "Downloading $BINARY_NAME from release $VERSION..."

        if gh release download "${VERSION}" \
          --repo grafana/grafana-bench \
          --pattern "${BINARY_NAME}" \
          --output grafana-bench 2>/dev/null; then
          chmod +x grafana-bench
          sudo mv grafana-bench /usr/local/bin/
          echo "installed=true" >> "$GITHUB_OUTPUT"
        else
          echo "No binary found for $VERSION, will fall back to go install"
          echo "installed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Go
      if: inputs.version != 'false' && steps.download.outputs.installed == 'false'
      uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
      with:
        go-version: '>=1.23.x'
        cache: false

    - name: Install grafana-bench via go install
      if: inputs.version != 'false' && steps.download.outputs.installed == 'false'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
        GOPRIVATE="github.com/grafana/grafana-bench" GOPROXY="direct" GOSUMDB="off" \
          go install "github.com/grafana/grafana-bench@${VERSION}"

    - name: Verify grafana-bench installation
      if: inputs.version != 'false'
      shell: bash
      run: grafana-bench version
    - id: get-secrets
      uses: grafana/shared-workflows/actions/get-vault-secrets@5cec40ba1a943db268a9bb33f208c006b161d372
      with:
        common_secrets: |
          PROMETHEUS_URL=grafana-bench:prometheus_url
          PROMETHEUS_USER=grafana-bench:prometheus_user
          PROMETHEUS_PASSWORD=grafana-bench:prometheus_token

