name: Publish TechDocs
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    #paths:
    #  - 'docs/**'
    #  - 'mkdocs.yml'
    #  - 'catalog-info.yaml'
    #  - '.github/workflows/publish-docs.yml'
    #  - 'actions/build-techdocs/**'
    #  - 'actions/publish-techdocs/**'

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: "1.22"
      - name: generate cobra docs
        run: |
          mkdir -p docs
          go run gendoc/main.go -o docs/
          ls -lha docs/*
          cd docs && pwd
      - name: publish docs
        uses: grafana/shared-workflows/.github/workflows/publish-techdocs.yaml@main
        # secrets: inherit
        with:
          namespace: default
          kind: component
          name: grafana-bench
          checkout-repo: false
