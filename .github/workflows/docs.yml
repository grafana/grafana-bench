name: Publish TechDocs
on:
  pull_request:
    branches:
      - main

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: "1.22"
      - name: generate cobra docs
        run: |
          mkdir -p docs
          go run gendoc/main.go -o docs/
  generate-docs:
    needs: "publish-docs"
    uses: grafana/shared-workflows/.github/workflows/publish-techdocs.yaml@main
    secrets: inherit
    with:
      namespace: default
      kind: component
      name: grafana-bench
