on:
  pull_request:
    branches:
      - main

        # START HERE.
        # figure out how to generate docs
        # think about a task file or makefile for repo
        # finish mkdocs.yml
        # update workflow
        # run workflow

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: "1.22"
  generate-docs:
    needs: "publish-docs"
    uses: grafana/shared-workflows/.github/workflows/publish-techdocs.yaml@main
    secrets: inherit
    with:
      namespace: default
      kind: component
      name: grafana-backend-services
