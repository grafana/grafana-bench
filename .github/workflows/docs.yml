name: documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'catalog-info.yaml'
      - '.github/workflows/publish-docs.yml'
      - 'actions/build-techdocs/**'
      - 'actions/publish-techdocs/**'
  pull_request:

jobs:
  gen-docs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch tags
        run: git fetch --tags

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: Generate documentation
        run: go run ./gendoc -o docs

      - name: Create suggestions
        id: create-suggestions
        uses: actions/github-script@v6
        with:
          script: |
            const { execSync } = require('child_process');
            
            // Check if docs changed
            try {
              execSync('git diff --exit-code docs/', { stdio: 'ignore' });
              console.log('No documentation changes needed');
              return;
            } catch {
              // Docs changed, create suggestions
            }
            
            const diff = execSync('git diff docs/').toString();
            
            // Filter out lines that only contain date changes and file headers
            const filteredDiff = diff.split('\n').filter(line => {
              // Skip file headers (--- a/file, +++ b/file)
              if (line.match(/^(---|\+\+\+) [ab]\//)) {
                return false;
              }
              // Skip lines that only change the auto-generated date
              if (line.match(/^[-+]###### Auto generated by spf13\/cobra on \d+-\w+-\d+$/)) {
                return false;
              }
              return true;
            }).join('\n');
            
            // Check if there are any meaningful changes after filtering
            const meaningfulChanges = filteredDiff.split('\n').some(line => 
              (line.startsWith('+') || line.startsWith('-')) && 
              !line.match(/^[-+]###### Auto generated by spf13\/cobra on \d+-\w+-\d+$/) &&
              !line.match(/^(---|\+\+\+) [ab]\//) &&
              line.trim() !== '+' && line.trim() !== '-'
            );
            
            if (!meaningfulChanges) {
              console.log('Only date/header changes detected, no documentation update needed');
              return;
            }
            
            const body = [
              "## 📚 Documentation Update Needed",
              "",
              "Changes to `cmd/` require documentation updates. Please run:",
              "",
              "```bash",
              "go run ./gendoc -o docs",
              "```",
              "",
              "<details>",
              "<summary>Preview of changes</summary>",
              "",
              "```diff",
              filteredDiff,
              "```",
              "</details>"
            ].join("\n");
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
            
            // Set output to indicate docs need updating
            core.setOutput('docs-needed', 'true');

      - name: gen docs required
        id: check-docs
        if: steps.create-suggestions.outputs.docs-needed == 'true'
        run: |
          echo "Documentation update required. Please run: go run ./gendoc -o docs"
          exit 1

  publish-to-enghub:
    if: github.event_name == 'push'
    uses: grafana/shared-workflows/.github/workflows/publish-techdocs.yaml@main
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      namespace: default
      kind: component
      name: grafana-bench
