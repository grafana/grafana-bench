name: update docs on release

on:
  workflow_call:

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Fetch all history for tags

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate updated documentation and libsonnet
        env:
          # Set to Jeff's timezone otherwise development
          # might straddle days on github actions and cause this step to fail
          TZ: 'America/Anchorage'
        run: |
          make docs
          make libsonnet

      - name: get version and author info
        id: get-info
        env:
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          # For release automation, use the tag name as version
          VERSION="$REF_NAME"
          AUTHOR="$ACTOR"

          # Sanitize version for branch name (remove invalid characters)
          SAFE_VERSION=$(echo "$VERSION" | sed 's/[^a-zA-Z0-9.-]/-/g')

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "safe_version=${SAFE_VERSION}" >> $GITHUB_OUTPUT
          echo "author=${AUTHOR}" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          base: main
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update documentation and libsonnet for ${{ steps.get-info.outputs.version }}"
          title: "📚 Update documentation and libsonnet for ${{ steps.get-info.outputs.version }}"
          body: |
            ## 📚 Documentation and Libsonnet Update for ${{ steps.get-info.outputs.version }}

            This PR updates the documentation and generates the libsonnet library for version ${{ steps.get-info.outputs.version }}.

            ### Changes
            - Updated CLI command documentation
            - Updated version references across all docs
            - Updated Docker image tags in examples
            - Generated versioned libsonnet library for deployment_tools

            Generated automatically by:
            - `make docs`
            - `make libsonnet`

            🤖 This PR was created automatically after successful release build and will be auto-merged.

            /cc @${{ steps.get-info.outputs.author }}
          branch: docs/update-${{ steps.get-info.outputs.safe_version }}
          branch-suffix: short-commit-hash
          delete-branch: true
          assignees: ${{ steps.get-info.outputs.author }}
          labels: |
            documentation
            automated

      - name: Auto-approve and merge PR
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          echo "Auto-approving and merging PR #$PR_NUMBER"

          # Approve the PR
          gh pr review $PR_NUMBER --approve --body "🤖 Auto-approved: Documentation updates are safe to merge automatically."

          # Wait a moment for the approval to register
          sleep 2

          # Merge the PR using squash merge
          gh pr merge $PR_NUMBER --squash --delete-branch

          echo "✅ PR #$PR_NUMBER has been approved and merged"
