name: release binaries

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Get release tag
        id: get-tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            # Manual trigger - get the latest release tag
            LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
            if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" == "null" ]; then
              echo "No releases found"
              exit 1
            fi
            TAG_NAME="$LATEST_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Called from CI on tag push or any tag-based trigger
            TAG_NAME="$GITHUB_REF_NAME"
          else
            echo "Unsupported trigger - not a tag push or manual dispatch"
            echo "EVENT_NAME: $EVENT_NAME"
            echo "GITHUB_REF: $GITHUB_REF" 
            echo "GITHUB_REF_NAME: $GITHUB_REF_NAME"
            exit 1
          fi
          
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Using tag: ${TAG_NAME}"

      - name: Build binaries
        run: |
          # Build for multiple platforms
          GOOS=linux GOARCH=amd64 go build -o grafana-bench-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -o grafana-bench-linux-arm64 .
          GOOS=darwin GOARCH=amd64 go build -o grafana-bench-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -o grafana-bench-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -o grafana-bench-windows-amd64.exe .

      - name: Create checksums
        run: |
          sha256sum grafana-bench-* > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ steps.get-tag.outputs.tag_name }}
          files: |
            grafana-bench-*
            checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
