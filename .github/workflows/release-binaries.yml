name: Release Binaries

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: grafana/setup-k6-action@v1

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Get release tag
        id: get-tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" == "release" ]; then
            # Running on release event
            TAG_NAME="$RELEASE_TAG"
          elif [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            # Manual trigger - get the latest release tag
            LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
            if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" == "null" ]; then
              echo "No releases found"
              exit 1
            fi
            TAG_NAME="$LATEST_TAG"
          else
            echo "Unsupported event: $EVENT_NAME"
            exit 1
          fi
          
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Using tag: ${TAG_NAME}"

      - name: Run tests
        run: go test -v ./...

      - name: Build binaries
        run: |
          # Build for multiple platforms
          GOOS=linux GOARCH=amd64 go build -o grafana-bench-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -o grafana-bench-linux-arm64 .
          GOOS=darwin GOARCH=amd64 go build -o grafana-bench-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -o grafana-bench-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -o grafana-bench-windows-amd64.exe .

      - name: Create checksums
        run: |
          sha256sum grafana-bench-* > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          tag_name: ${{ steps.get-tag.outputs.tag_name }}
          files: |
            grafana-bench-*
            checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
