name: validate docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'catalog-info.yaml'
      - '.github/workflows/publish-docs.yml'
      - 'actions/build-techdocs/**'
      - 'actions/publish-techdocs/**'
  pull_request:

jobs:
  check-docs-up-to-date:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Fetch tags
        run: git fetch --tags

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # `make libsonnet` is not run here: libsonnet/ is gitignored, so it can never
      # show up in a diff. The generated library is validated by the test-libsonnet
      # job in ci.yml instead.
      - name: Generate documentation
        env:
          # Use a fixed timezone so make docs doesn't straddle days
          # and produce spurious date-only changes in auto-generated files
          TZ: 'America/Anchorage'
        run: make docs

      - name: Comment if docs are out of date
        id: create-suggestions
        uses: actions/github-script@v8
        with:
          script: |
            const { execSync } = require('child_process');
            const git = cmd => execSync(cmd, { encoding: 'utf8' });

            const changedFiles = git('git diff --name-only docs/').trim().split('\n').filter(Boolean);
            if (changedFiles.length === 0) {
              console.log('No documentation changes needed');
              return;
            }

            // The generator stamps this line on every run, whether or not the source changed
            const isDateLine = line => /^[-+]###### Auto generated by spf13\/cobra on \d+-\w+-\d+$/.test(line);
            const isFileHeader = line => /^(---|\+\+\+) [ab]\//.test(line);
            const isChange = line => /^[-+]/.test(line) && !isFileHeader(line) && line.trim() !== '+' && line.trim() !== '-';

            // Blank out the values the generator takes from repo state rather than from source
            // code: the latest release tag and the action's commit SHA. A line whose only edit
            // was one of those substitutions then normalises to its own counterpart.
            const normalise = line => line.slice(1)
              .replace(/v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?/g, '<VERSION>')
              .replace(/[0-9a-f]{40}/g, '<SHA>');

            const cliFiles = [];
            const contentFiles = [];
            const releaseFiles = [];
            const blockingDiffs = [];

            for (const file of changedFiles) {
              const fileDiff = git(`git diff -- ${file}`);
              const changes = fileDiff.split('\n').filter(line => isChange(line) && !isDateLine(line));

              // Only the generator's own timestamp moved
              if (changes.length === 0) continue;

              const removed = changes.filter(line => line.startsWith('-')).map(normalise).sort();
              const added = changes.filter(line => line.startsWith('+')).map(normalise).sort();

              // Version and SHA references follow the latest release tag, which the
              // release-docs workflow owns. A PR author does not control them, so note
              // the drift and carry on rather than asking them to regenerate.
              if (removed.length === added.length && removed.every((line, i) => line === added[i])) {
                releaseFiles.push(file);
                continue;
              }

              if (/\/bench(_\w+)?\.md$/.test(file)) cliFiles.push(file);
              else contentFiles.push(file);

              blockingDiffs.push(fileDiff.split('\n').filter(line => !isFileHeader(line) && !isDateLine(line)).join('\n'));
            }

            if (releaseFiles.length > 0) {
              core.notice(`Version or action-SHA references trail the latest release tag in: ${releaseFiles.join(', ')}. The release-docs workflow updates these, so no action is needed on this PR.`);
            }

            if (blockingDiffs.length === 0) {
              console.log('No documentation changes needed from this PR');
              return;
            }

            const lines = [
              "## 📚 Generated documentation is out of date",
              "",
              "This PR changes source that the documentation is generated from. Please run:",
              "",
              "```sh",
              "make docs",
              "```",
              "",
              "and commit the result.",
              "",
              "### What needs updating",
              "",
            ];

            if (cliFiles.length > 0) {
              lines.push("**CLI reference** — auto-generated from `cmd/` source code:");
              cliFiles.forEach(f => lines.push(`- \`${f}\``));
              lines.push("");
            }

            if (contentFiles.length > 0) {
              lines.push("**Other documentation** changes:");
              contentFiles.forEach(f => lines.push(`- \`${f}\``));
              lines.push("");
            }

            lines.push(
              "<details>",
              "<summary>View full diff</summary>",
              "",
              "```diff",
              blockingDiffs.join("\n"),
              "```",
              "</details>"
            );

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: lines.join("\n"),
            });

            core.setOutput('docs-needed', 'true');

      - name: Fail if generated documentation is out of date
        if: steps.create-suggestions.outputs.docs-needed == 'true'
        run: |
          echo "Generated documentation is out of date. Please run: make docs"
          exit 1

  publish-to-enghub:
    if: github.event_name == 'push'
    uses: grafana/shared-workflows/.github/workflows/publish-techdocs.yaml@main
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      namespace: default
      kind: component
      name: grafana-bench
