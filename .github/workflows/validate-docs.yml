name: validate docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'catalog-info.yaml'
      - '.github/workflows/publish-docs.yml'
      - 'actions/build-techdocs/**'
      - 'actions/publish-techdocs/**'
  pull_request:

jobs:
  check-docs-up-to-date:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Fetch tags
        run: git fetch --tags

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate documentation
        run: make docs

      - name: Comment if docs are out of date
        id: create-suggestions
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');

            // Check if docs changed
            try {
              execSync('git diff --exit-code docs/', { stdio: 'ignore' });
              console.log('No documentation changes needed');
              return;
            } catch {
              // Docs changed, continue
            }

            const diff = execSync('git diff docs/').toString();
            const changedFiles = execSync('git diff --name-only docs/').toString().trim().split('\n').filter(Boolean);

            // Filter out lines that only contain date changes and file headers
            const isDateLine = line => line.match(/^[-+]###### Auto generated by spf13\/cobra on \d+-\w+-\d+$/);
            const isFileHeader = line => line.match(/^(---|\+\+\+) [ab]\//);

            const filteredDiff = diff.split('\n').filter(line => !isFileHeader(line) && !isDateLine(line)).join('\n');

            // Check if there are any meaningful changes after filtering
            const meaningfulChanges = filteredDiff.split('\n').some(line =>
              (line.startsWith('+') || line.startsWith('-')) &&
              !isDateLine(line) && !isFileHeader(line) &&
              line.trim() !== '+' && line.trim() !== '-'
            );

            if (!meaningfulChanges) {
              console.log('Only date/header changes detected, no documentation update needed');
              return;
            }

            // Categorize changed files so the comment explains what happened
            const cliFiles = changedFiles.filter(f => f.match(/bench_\w+\.md$/));
            const otherFiles = changedFiles.filter(f => !f.match(/bench_\w+\.md$/));

            const versionFiles = [];
            const shaFiles = [];
            const contentFiles = [];

            for (const file of otherFiles) {
              const fileDiff = execSync(`git diff -- ${file}`).toString();
              const hasVersion = /[-+].*v\d+\.\d+\.\d+/.test(fileDiff);
              const hasSHA = /[-+].*[a-f0-9]{40}/.test(fileDiff);
              if (hasSHA) shaFiles.push(file);
              else if (hasVersion) versionFiles.push(file);
              else contentFiles.push(file);
            }

            // Extract new version if present
            let newVersion = '';
            try {
              const versionMatch = execSync('git diff -- docs/index.md').toString().match(/\+.*?(v\d+\.\d+\.\d+)/);
              if (versionMatch) newVersion = versionMatch[1];
            } catch {}

            const lines = [
              "## 📚 Documentation is out of date",
              "",
              "This PR contains changes that require a documentation update. Please run:",
              "",
              "```sh",
              "make docs",
              "```",
              "",
              "and commit the result.",
              "",
              "### What needs updating",
              "",
            ];

            if (cliFiles.length > 0) {
              lines.push("**CLI reference** — auto-generated from `cmd/` source code:");
              cliFiles.forEach(f => lines.push(`- \`${f}\``));
              lines.push("");
            }

            if (versionFiles.length > 0) {
              const versionNote = newVersion ? ` (new version: \`${newVersion}\`)` : '';
              lines.push(`**Version references**${versionNote} — version strings in examples and install instructions:`);
              versionFiles.forEach(f => lines.push(`- \`${f}\``));
              lines.push("");
            }

            if (shaFiles.length > 0) {
              lines.push("**GitHub Action SHA references** — pinned commit hashes in workflow examples:");
              shaFiles.forEach(f => lines.push(`- \`${f}\``));
              lines.push("");
            }

            if (contentFiles.length > 0) {
              lines.push("**Other documentation** changes:");
              contentFiles.forEach(f => lines.push(`- \`${f}\``));
              lines.push("");
            }

            lines.push(
              "<details>",
              "<summary>View full diff</summary>",
              "",
              "```diff",
              filteredDiff,
              "```",
              "</details>"
            );

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: lines.join("\n"),
            });

            core.setOutput('docs-needed', 'true');

      - name: Fail if docs are out of date
        if: steps.create-suggestions.outputs.docs-needed == 'true'
        run: |
          echo "Documentation is out of date. Please run: make docs"
          exit 1

  publish-to-enghub:
    if: github.event_name == 'push'
    uses: grafana/shared-workflows/.github/workflows/publish-techdocs.yaml@main
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      namespace: default
      kind: component
      name: grafana-bench
