name: publish-bench-image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-go:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: false

      - uses: ./.github/actions/setup-k6

      - name: install development dependencies
        run: make install-deps

      - uses: ./.github/actions/setup-grafana-bench
        with:
          version: false

      - name: install bench
        run: go install .

      - name: test
        env:
          SERVICE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'ci' }}
        run: |
          grafana-bench test \
            --service grafana-bench \
            --service-version $SERVICE_VERSION \
            --test-runner go \
            --suite-name gotest \
            --go-test-packages ./... \
            --run-stage ci \
            --prometheus-metrics

      - name: build
        run: go build -v ./...

  test-benchmarks:
    runs-on: ubuntu-x64-2xlarge
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Prometheus secrets
        uses: ./.github/actions/setup-grafana-bench
        with:
          version: false  # Only setup secrets, skip installation

      - name: Install latest grafana-bench with gobench support
        run: go install

      - name: Run Go benchmarks with Prometheus metrics
        env:
          SERVICE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}
        run: |
          grafana-bench test \
            --service grafana-bench \
            --service-version $SERVICE_VERSION \
            --test-runner gobench \
            --suite-path pkg/executor/gobench/tests \
            --suite-name gobench \
            --gobench-time 5s \
            --gobench-mem \
            --report-output log \
            --run-stage ci \
            --prometheus-metrics \
            --log-level info

      - name: Verify benchmark metrics were captured
        run: |
          echo "✅ Benchmark run completed successfully"
          echo "Metrics exported to Prometheus at: $PROMETHEUS_URL"

  test-binary:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    services:
      grafana:
        image: grafana/grafana:12.4.1@sha256:e932bd6ed0e026595b08483cd0141e5103e1ab7ff8604839ff899b8dc54cabcb
        ports:
          - 3000:3000
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: false

      - uses: ./.github/actions/setup-k6

      - name: Install
        run: go install

      - id: get-secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@f1614b210386ac420af6807a997ac7f6d96e477a # get-vault-secrets/v1.3.1
        with:
          # Secrets placed in the ci/repo/grafana/<repo>/<path> path in Vault
          repo_secrets: |
            SLACK_TOKEN=slack_token:slack_token

      - name: Test Slack Notifications
        env:
          SUITE_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grafana-bench test \
            --service grafana \
            --service-url http://localhost:3000 \
            --service-version 12.3.1 \
            --test-type smoke \
            --suite-path CI/k6 \
            --log-level info \
            --suite-revision ${{ github.event.pull_request.head.sha || github.sha }} \
            --report-output log \
            --suite-name slack \
            --run-stage ci \
            --slack-notifications

  test-libsonnet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Install dependencies
        run: make install-deps

      - name: Generate libsonnet and run function tests
        run: |
          make libsonnet

  test-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    services:
      grafana:
        image: grafana/grafana:12.4.1@sha256:e932bd6ed0e026595b08483cd0141e5103e1ab7ff8604839ff899b8dc54cabcb
        ports:
          - 3000:3000
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Install
        run: go install

      - name: --slack-notifier-permissions Should fail with no slack token
        run: |
          if ! grafana-bench validate --slack-notifier-permissions; then
            echo "Command failed without token as expected"
          else
            echo "Command unexpectedly succeeded"
            exit 1
          fi

      - id: get-secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@f1614b210386ac420af6807a997ac7f6d96e477a # get-vault-secrets/v1.3.1
        with:
          # Secrets placed in the ci/repo/grafana/<repo>/<path> path in Vault
          repo_secrets: |
            SLACK_TOKEN=slack_token:slack_token

      - name: --slack-notifier-permissions should pass
        env:
          SUITE_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grafana-bench validate --check-slack-permissions

      - name: --slack-notifier-permissions should fail if we don't have permissions on a channel
        run: |
          mv codeowners-mapping.yaml codeowners-mapping.yaml.tmp
          cat > codeowner-mapping.yaml << 'EOF'
          mapping:
            - slack_channel: "grafana-bench-private"
              github_team: "@grafana/grafana-developer-enablement-squad"
          EOF

          if ! grafana-bench validate --check-slack-permissions; then
            echo "Command failed as expected"
          else
            echo "Command unexpectedly succeeded"
            exit 1
          fi

  test-checkout:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Install
        run: go install

      - name: Test checkout current repository
        env:
          SUITE_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/checkout-test-current
          grafana-bench checkout \
            --suite-repo-url https://github.com/grafana/grafana-bench.git \
            --suite-base /tmp/checkout-test-current \
            --suite-revision ${{ github.event.pull_request.head.sha || github.sha }}

          # Verify checkout was successful
          [ -f /tmp/checkout-test-current/bench.go ] || { echo "Failed to checkout current repo"; exit 1; }
          echo "✓ Successfully checked out current repository"

      - name: Test checkout specific commit
        env:
          SUITE_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grafana-bench checkout \
            --suite-repo-url https://github.com/grafana/grafana-bench.git \
            --suite-base /tmp/checkout-test-commit \
            --suite-revision a5f38ee99875d3b18d5ee83ce683cc70b1c0e0a8

          # Verify checkout was successful
          [ -f /tmp/checkout-test-commit/bench.go ] || { echo "Failed to checkout specific commit"; exit 1; }

          # Verify we have the specific content from commit a5f38ee (30-Sep-2024)
          # This commit should have the compile command docs with the specific date
          [ -f /tmp/checkout-test-commit/docs/bench_compile.md ] || { echo "Expected bench_compile.md file not found"; exit 1; }
          if grep -q "Auto generated by spf13/cobra on 30-Sep-2024" /tmp/checkout-test-commit/docs/bench_compile.md; then
            echo "✓ Successfully checked out specific commit (verified by docs date stamp)"
          else
            echo "Failed: Expected 30-Sep-2024 date stamp not found in bench_compile.md"
            echo "Found instead:"
            tail -1 /tmp/checkout-test-commit/docs/bench_compile.md
            exit 1
          fi

      - name: Test checkout release tag
        env:
          SUITE_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grafana-bench checkout \
            --suite-repo-url https://github.com/grafana/grafana-bench.git \
            --suite-base /tmp/checkout-test-release \
            --suite-revision v0.6.0

          # Verify checkout was successful
          [ -f /tmp/checkout-test-release/bench.go ] || { echo "Failed to checkout release"; exit 1; }

          # Verify we have the specific content from v0.6.0 release
          # This release should have the docs with the 12-Jun-2025 date
          [ -f /tmp/checkout-test-release/docs/bench.md ] || { echo "Expected bench.md file not found"; exit 1; }
          if grep -q "Auto generated by spf13/cobra on 12-Jun-2025" /tmp/checkout-test-release/docs/bench.md; then
            echo "✓ Successfully checked out release tag (verified by docs date stamp)"
          else
            echo "Failed: Expected 12-Jun-2025 date stamp not found in bench.md"
            echo "Found instead:"
            tail -1 /tmp/checkout-test-release/docs/bench.md
            exit 1
          fi

      - name: Test checkout specific folder
        env:
          SUITE_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grafana-bench checkout \
            --suite-repo-url https://github.com/grafana/grafana-bench.git \
            --suite-base /tmp/checkout-test-folder \
            --suite-revision ${{ github.event.pull_request.head.sha || github.sha }} \
            --suite-repo-dirs CI/k6

          # Verify checkout was successful and contains the specific folder
          [ -f /tmp/checkout-test-folder/CI/k6/api_test.ts ] || { echo "Failed to checkout specific folder"; exit 1; }

          # Verify that root files are NOT present (sparse checkout should only include CI/k6)
          [ ! -f /tmp/checkout-test-folder/bench.go ] || { echo "Unexpected: bench.go should not be present in sparse checkout"; exit 1; }

          echo "✓ Successfully checked out repository with specific folder (sparse checkout)"

  test-setup-action:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Test setup-grafana-bench action with known binary
        uses: ./.github/actions/setup-grafana-bench
        with:
          version: 'v0.6.6'

      - name: Verify installation
        run: |
          grafana-bench version
          which grafana-bench

      - name: Verify environment variables are set
        run: |
          echo "Checking Prometheus environment variables..."
          if [ -z "$PROMETHEUS_URL" ]; then
            echo "❌ PROMETHEUS_URL is not set"
            exit 1
          else
            echo "✅ PROMETHEUS_URL is set"
          fi

          if [ -z "$PROMETHEUS_USER" ]; then
            echo "❌ PROMETHEUS_USER is not set"
            exit 1
          else
            echo "✅ PROMETHEUS_USER is set"
          fi

          if [ -z "$PROMETHEUS_PASSWORD" ]; then
            echo "❌ PROMETHEUS_PASSWORD is not set"
            exit 1
          else
            echo "✅ PROMETHEUS_PASSWORD is set"
          fi

          echo "All Prometheus environment variables are properly set!"

      - name: Test setup-grafana-bench action with go install fallback (missing binary)
        uses: ./.github/actions/setup-grafana-bench
        with:
          version: 'v0.6.1'

  check-licenses:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest

      - name: Check dependency licenses
        run: |
          go-licenses check ./... \
            --allowed_licenses=MIT,ISC,BSD-3-Clause,BSD-2-Clause,Apache-2.0,AGPL-3.0,MPL-2.0 \
            --ignore buf.build/gen/go/prometheus/prometheus/protocolbuffers/go \
            --ignore github.com/grafana/grafana-bench

  release-binaries:
    needs: [test-go, test-benchmarks, test-libsonnet, test-binary, test-validate, test-checkout, test-setup-action, check-licenses]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: ./.github/workflows/release-binaries.yml

  build-base-image:
    needs: [test-go, test-benchmarks, test-libsonnet, test-binary, test-validate, test-checkout, test-setup-action, check-licenses]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-base-image.yml
    secrets:
      SUITE_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-playwright-image:
    needs: [test-go, test-benchmarks, test-libsonnet, test-binary, test-validate, test-checkout, test-setup-action, check-licenses]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-playwright-image.yml


  # Generate and publish libsonnet libraries  
  update-experimental-libsonnet:
    needs: [build-base-image, build-playwright-image]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/update-libsonnet.yml
    with:
      version: "experimental"
      branch_prefix: "auto-merge/bench-libsonnet-experimental"
      pr_message: "Update experimental bench libsonnet from main branch\\n\\nThis PR updates the experimental bench libsonnet library with the latest changes from the main branch.\\n\\nChanges:\\n- Update ksonnet/lib/bench/experimental/main.libsonnet\\n- Update ksonnet/lib/bench/experimental/main_test.jsonnet\\n- Update ksonnet/lib/bench/versions.libsonnet\\n\\n⚠️ This is an experimental version - use for testing only.\\n\\nImport with:\\n```jsonnet\\nlocal benchVersions = import 'bench/versions.libsonnet';\\nlocal benchFunctions = benchVersions.getBenchFunctions('experimental');\\n```"
      commit_message: "Update bench experimental libsonnet from main\\n\\nThis commit updates the experimental bench libsonnet library with the latest changes.\\n\\nGenerated automatically from bench CLI flags."
      base_image_url: "us-docker.pkg.dev/grafanalabs-dev/docker-grafana-bench-dev/grafana-bench"
      playwright_image_url: "us-docker.pkg.dev/grafanalabs-dev/docker-grafana-bench-dev/grafana-bench-playwright"

  update-versioned-libsonnet:
    needs: [build-base-image, build-playwright-image]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/update-libsonnet.yml
    with:
      version: ${{ github.ref_name }}
      branch_prefix: "auto-merge/bench-libsonnet-release"
      pr_message: "Add bench libsonnet versioned release\\n\\nThis PR adds the versioned libsonnet library for bench, generated automatically from the CLI flags.\\n\\nChanges:\\n- Add ksonnet/lib/bench/[version]/main.libsonnet\\n- Add ksonnet/lib/bench/[version]/main_test.jsonnet\\n- Update ksonnet/lib/bench/versions.libsonnet to include version\\n\\nOnce this is merged, users can import the versioned library with:\\n```jsonnet\\nlocal benchVersions = import 'bench/versions.libsonnet';\\nlocal benchFunctions = benchVersions.getBenchFunctions('[version]');\\n```"
      commit_message: "Add bench libsonnet versioned release\\n\\nThis commit adds the versioned bench libsonnet library.\\n\\nGenerated automatically from bench CLI flags."

  update-docs:
    needs: [build-base-image, build-playwright-image]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/release-docs.yml
