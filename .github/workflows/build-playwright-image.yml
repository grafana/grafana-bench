name: build publish playwright image

on:
  workflow_call:

jobs:
  test-container-playwright:
    runs-on: ubuntu-x64-2xlarge

    # run local registry that buildx can push to
    services:
      registry:
        image: registry:3@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e
        ports:
          - 5000:5000
      grafana:
        image: grafana/grafana:12.4.5@sha256:26b8f35a9e4e4431995cf64c3f396505a4faf17bcfc19f9ed84943ec6bfd5ecd
        ports:
          - 3000:3000

    env:
      DOCKER_CLI_EXPERIMENTAL: enabled
    steps:
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: get short sha
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c 1-7)" >> $GITHUB_ENV
      - name: build dev container
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: Dockerfile-playwright.dev
          build-args: |-
            BENCH_REVISION=${{ env.SHORT_SHA }}
          load: true
          tags: localhost:5000/grafana-bench-test-playwright-dev:latest

      - name: debug permissions before mounting
        run: |
          echo "=== Host CI directory permissions ==="
          ls -la ./CI/
          ls -la ./CI/playwright-e2e/ || echo "playwright directory doesn't exist"
          echo "=== Current user info ==="
          id
          echo "=== CI directory ownership ==="
          stat ./CI/
          echo "=== Host user UID/GID ==="
          echo "UID: $(id -u)"
          echo "GID: $(id -g)"

      - name: check Grafana instance
        run: |
          curl http://localhost:3000
          #RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)
          #echo $response
          #if [ $RESPONSE -ne 200 ]; then
          #  sleep 5;
          #  echo "Grafana is not accessible"
          #  exit 1
          #fi

      - name: mount and run playwright test suite in dev container (FIXUID)
        env:
          SUITE_REPO_TOKEN: ${{ github.token }}
        run: |
          # Run as host user to avoid volume mount permission issues on large runners
          docker run --rm --network=host --volume="./CI/:/tests/CI/" \
             --user "$(id -u):$(id -g)" \
             --env "HOME=/tmp" \
             localhost:5000/grafana-bench-test-playwright-dev:latest test \
              --log-level debug \
              --service grafana \
              --service-url http://localhost:3000 \
              --service-version 12.3.1 \
              --pw-prepare "yarn install; yarn playwright install" \
              --pw-execute "yarn playwright test --grep-invert @performance" \
              --report-output log \
              --run-stage grafana-bench-ci \
              --suite-path ./CI/playwright \
              --suite-revision ${{ github.event.pull_request.head.sha || github.sha }}\
              --suite-name grafana-bench-dev/ci/playwright \
              --test-runner playwright \
              --test-type smoke

      - name: build prod container
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: Dockerfile-playwright
          build-args: |-
            BENCH_REVISION=${{ env.SHORT_SHA }}
          load: true
          tags: localhost:5000/grafana-bench-test-playwright:latest

      - name: checkout and run playwright test suite
        env:
          SUITE_REPO_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e SUITE_REPO_TOKEN --network=host \
            localhost:5000/grafana-bench-test-playwright:latest test \
            --log-level debug \
            --service grafana \
            --service-url http://localhost:3000 \
            --service-version 12.3.1 \
            --pw-prepare "yarn install; yarn playwright install" \
            --pw-execute "yarn playwright test" \
            --report-output log \
            --run-stage grafana-bench-ci \
            --suite-path ./CI/playwright \
            --suite-revision ${{ github.event.pull_request.head.sha || github.sha }}\
            --suite-name grafana-bench/ci/playwright \
            --suite-repo-url https://github.com/grafana/grafana-bench.git \
            --test-runner playwright \
            --test-type smoke

  publish-dev-playwright:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-container-playwright]
    runs-on: ubuntu-x64-2xlarge
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: get short sha
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c 1-7)" >> $GITHUB_ENV
      - name: Log into ghcr.io
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      - uses: grafana/shared-workflows/actions/push-to-gar-docker@de81a07e6f6718fb289c7a4612c9c514c28bd798 # v0.4.1
        id: push-to-gar-dev
        with:
          environment: "dev"
          file: Dockerfile-playwright.dev
          image_name: grafana-bench-playwright
          platforms: linux/amd64,linux/arm64
          build-args: |-
            BENCH_REVISION=${{ env.SHORT_SHA }}
          tags: |-
            dev-${{ env.SHORT_SHA }}
            dev-latest
      - name: copy dev image to ghcr.io
        run: |
          GAR_IMAGE=$(echo "${{ steps.push-to-gar-dev.outputs.tags }}" | head -n1)
          echo "GAR_IMAGE=$GAR_IMAGE"

          GHCR_IMAGE=ghcr.io/grafana/grafana-bench-playwright:dev-${{ steps.push-to-gar-dev.outputs.version }}
          echo "GHCR_IMAGE=$GHCR_IMAGE"

          docker buildx imagetools create \
            --tag $GHCR_IMAGE \
            $GAR_IMAGE

  publish-prod-playwright:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [test-container-playwright]
    runs-on: ubuntu-x64-2xlarge
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Log into ghcr.io
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      - name: get short sha
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c 1-7)" >> $GITHUB_ENV
      - uses: grafana/shared-workflows/actions/push-to-gar-docker@de81a07e6f6718fb289c7a4612c9c514c28bd798 # v0.4.1
        id: push-to-gar-prod
        with:
          environment: "prod"
          file: Dockerfile-playwright
          image_name: grafana-bench-playwright
          platforms: linux/amd64,linux/arm64
          build-args: |-
            BENCH_REVISION=${{ github.ref_name }}
          tags: |-
            ${{ github.ref_name }}
            ${{ env.SHORT_SHA }}
            latest
      - name: copy prod image to ghcr.io
        run: |
          GAR_IMAGE=$(echo "${{ steps.push-to-gar-prod.outputs.tags }}" | head -n1)
          echo "GAR_IMAGE=$GAR_IMAGE"

          GHCR_IMAGE=ghcr.io/grafana/grafana-bench-playwright:${{ steps.push-to-gar-prod.outputs.version }}
          echo "GHCR_IMAGE=$GHCR_IMAGE"

          GHCR_IMAGE_LATEST=ghcr.io/grafana/grafana-bench-playwright:latest
          echo "GHCR_IMAGE_LATEST=$GHCR_IMAGE_LATEST"

          docker buildx imagetools create \
            --tag $GHCR_IMAGE --tag $GHCR_IMAGE_LATEST \
            $GAR_IMAGE
