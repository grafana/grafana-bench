name: Measure frontend asset size
# These permissions are needed to assume roles from Github's OIDC.
permissions:
  contents: read
  id-token: write
  packages: write
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 * * * *'
  # Optional: Also allow manual triggering
  workflow_dispatch:
jobs:
  measure-frontend-assets:
    runs-on: ubuntu-latest

    services:
      grafana:
        image: grafana/grafana:latest
        ports:
          - 3000:3000

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: install bench
        run: go install ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          #cache: 'yarn'
          #cache-dependency-path: './CI/plugin-e2e/yarn.lock'
      - name: Setup Playwright
        uses: microsoft/playwright-github-action@v1

      - name: setup playwright
        working-directory: ./CI/plugin-e2e
        run: |
          yarn install && yarn playwright install

      - name: run playwright tests
        working-directory: ./CI/plugin-e2e
        run: yarn run test --grep @performance

      ## START HERE - figure out where asset metrics file is being written
      - name: cat results
        run: cat /tmp/asset-metrics.json

      - name: report result
        run: |
          grafana-bench report \
            --grafana-url "http://localhost:3000" \ # this is a bad grafana url because we are forcing a login
            --suite-run-metrics-prefix "Assets" \
            /tmp/asset-metrics.json

