name: Measure frontend asset size
# These permissions are needed to assume roles from Github's OIDC.
permissions:
  contents: read
  id-token: write
  packages: write
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 * * * *'
  # Optional: Also allow manual triggering
  workflow_dispatch:
jobs:
  measure-frontend-assets:
    runs-on: ubuntu-latest

    services:
      grafana:
        image: grafana/grafana:latest
        ports:
          - 3000:3000

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: install bench
        run: go install

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      - name: setup playwright
        working-directory: ./CI/plugin-e2e
        run: |
          yarn install && yarn playwright install

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: run playwright tests
        working-directory: ./CI/plugin-e2e
        run: yarn run test --grep @performance

      - name: cat results
        run: |
          ls /tmp/
          cat /tmp/asset-metrics.txt

      - name: report result
        run: |
          cat /tmp/asset-metrics.txt
          grafana-bench report \
            --grafana-url "http://localhost:3000" \
            --grafana-version "rrc-instant" \
            --prometheus-password ${{ secrets.OPS_PROMETHEUS_PUSH_TOKEN }} \
            --run-metrics-file "/tmp/asset-metrics.txt"
            --run-metrics-prefix "FrontendAssets" \
            --log-level DEBUG
