name: Measure frontend asset size
# These permissions are needed to assume roles from Github's OIDC.
permissions:
  contents: read
  id-token: write
  packages: write
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 * * * *'
  # Optional: Also allow manual triggering
  workflow_dispatch:
jobs:
  measure-frontend-assets:
    runs-on: ubuntu-latest

    services:
      grafana:
        image: grafana/grafana:latest
        ports:
          - 3000:3000

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: install bench
        run: go install

      - name: setup playwright
        run: |
          yarn install && yarn playwright install

      - name: run playwright tests
        run: cd CI/ && yarn run test --grep @performance

      #- name: create empty file for asset sizes
      #  run: |
      #    # Create an empty file first
      #    touch ./CI/asset-sizes.json
      #- name: run playwright tests
      #  run: |
      #    docker run --network=host \
      #      --volume="./CI/:/home/bench/tests/CI/" \
      #      --volume="./CI/asset-sizes.json:/tmp/asset-sizes.json" \
      #      us-docker.pkg.dev/grafanalabs-dev/docker-grafana-bench-dev/grafana-bench:latest test \
      #      --config "/home/bench/tests/CI/playwright.yaml" \
      #      --pw-execute "yarn run test --grep @performance"

      - name: cat results
        run: cat ./CI/asset-metrics.json

      - name: report result
        run: |
          grafana-bench report \
            --grafana-url "http://localhost:3000" \ # this is a bad grafana url because we are forcing a login
            --suite-run-metrics-prefix "Assets" \
            /tmp/asset-metrics.json

