name: Manual libsonnet deployment

on:
  workflow_dispatch:
    inputs:
      deployment_type:
        description: 'Type of deployment'
        required: true
        type: choice
        options:
          - experimental
          - custom
        default: experimental
      custom_version:
        description: 'Custom version (only used if deployment_type is "custom")'
        required: false
        type: string
      custom_target_dir:
        description: 'Custom target directory (only used if deployment_type is "custom")'
        required: false
        type: string

jobs:
  deploy-experimental:
    if: inputs.deployment_type == 'experimental'
    uses: ./.github/workflows/update-libsonnet.yml
    permissions:
      contents: read
      id-token: write
    with:
      version: "experimental"
      target_dir: "bench/experimental"
      branch_prefix: "bench-libsonnet-experimental"
      pr_title: "[Experimental] Update experimental bench libsonnet (manual)"
      pr_message: "Manual update of experimental bench libsonnet from main branch\\n\\nThis PR updates the experimental bench libsonnet library with the latest changes from the main branch.\\n\\nChanges:\\n- Update ksonnet/lib/argo-workflows-util/common-steps/bench/experimental/bench.libsonnet\\n\\n⚠️ This is an experimental version - use for testing only.\\n\\nImport with:\\n```jsonnet\\nlocal bench = import 'argo-workflows-util/common-steps/bench/experimental/bench.libsonnet';\\n```"
      commit_message: "Manual update of bench experimental libsonnet\\n\\nThis commit manually updates the experimental bench libsonnet library.\\n\\nGenerated automatically from bench CLI flags."
      download_url: "https://raw.githubusercontent.com/grafana/grafana-bench/main/libsonnet/bench.libsonnet"

  deploy-custom:
    if: inputs.deployment_type == 'custom'
    uses: ./.github/workflows/update-libsonnet.yml
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ inputs.custom_version }}
      target_dir: ${{ inputs.custom_target_dir }}
      branch_prefix: "bench-libsonnet-custom"
      pr_title: "Custom bench libsonnet deployment: ${{ inputs.custom_version }}"
      pr_message: "Custom deployment of bench libsonnet ${{ inputs.custom_version }}\\n\\nThis is a custom/manual deployment.\\n\\nChanges:\\n- Add/update ksonnet/lib/argo-workflows-util/common-steps/${{ inputs.custom_target_dir }}/bench.libsonnet"
      commit_message: "Custom deployment of bench libsonnet ${{ inputs.custom_version }}"
      download_url: "https://raw.githubusercontent.com/grafana/grafana-bench/main/libsonnet/bench.libsonnet"