name: "release: update docs"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Fetch all history for tags

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate updated documentation and libsonnet
        env:
          # Set to Jeff's timezone otherwise development
          # might straddle days on github actions and cause this step to fail
          TZ: 'America/Anchorage'
        run: |
          make docs
          make libsonnet

      - name: get version and author info
        id: get-info
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$EVENT_NAME" == "workflow_call" ]; then
            # Called from CI on tag push - use the tag name
            VERSION="$REF_NAME"
          elif [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            # Manual trigger - get the latest release tag
            LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
            if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" == "null" ]; then
              echo "No releases found"
              exit 1
            fi
            VERSION="$LATEST_TAG"
          else
            echo "Skipping: triggered by $EVENT_NAME (expected workflow_call or workflow_dispatch)"
            exit 0
          fi
          
          AUTHOR="$ACTOR"
          
          # Sanitize version for branch name (remove invalid characters)
          SAFE_VERSION=$(echo "$VERSION" | sed 's/[^a-zA-Z0-9.-]/-/g')
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "safe_version=${SAFE_VERSION}" >> $GITHUB_OUTPUT
          echo "author=${AUTHOR}" >> $GITHUB_OUTPUT
          echo "Using version: ${VERSION}"

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          base: main
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update documentation and libsonnet for ${{ steps.get-info.outputs.version }}"
          title: "📚 Update documentation and libsonnet for ${{ steps.get-info.outputs.version }}"
          body: |
            ## 📚 Documentation and Libsonnet Update for ${{ steps.get-info.outputs.version }}

            This PR updates the documentation and generates the libsonnet library for version ${{ steps.get-info.outputs.version }}.

            ### Changes
            - Updated CLI command documentation
            - Updated version references across all docs
            - Updated Docker image tags in examples
            - Generated versioned libsonnet library for deployment_tools

            Generated automatically by:
            - `make docs`
            - `make libsonnet`

            🤖 This PR was created automatically after successful release build and will be auto-merged.

            /cc @${{ steps.get-info.outputs.author }}
          branch: docs/update-${{ steps.get-info.outputs.safe_version }}
          branch-suffix: short-commit-hash
          delete-branch: true
          assignees: ${{ steps.get-info.outputs.author }}
          labels: |
            documentation
            automated

      - name: Auto-merge PR
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          echo "Auto-merging PR #$PR_NUMBER"

          # Enable auto-merge so the PR merges once branch protection requirements are met
          gh pr merge $PR_NUMBER --squash --delete-branch --auto

          echo "✅ PR #$PR_NUMBER auto-merge enabled"
