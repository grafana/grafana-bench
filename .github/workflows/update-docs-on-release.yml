name: Update docs on release

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - '.github/actions/setup-grafana-bench/action.yml'

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Fetch all history for tags

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate updated documentation
        run: go run ./generators/doc -o docs

      - name: Generate libsonnet library
        run: go run ./generators/libsonnet -o libsonnet

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet docs/ libsonnet/; then
            echo "No documentation or libsonnet changes needed"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Documentation or libsonnet changes detected"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Debug trigger info
        if: steps.check-changes.outputs.has_changes == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
        run: |
          echo "Event name: $EVENT_NAME"
          echo "GitHub ref: $GITHUB_REF"
          echo "GitHub ref name: $GITHUB_REF_NAME"
          echo "GitHub ref type: $GITHUB_REF_TYPE"

      - name: Get version and author info
        if: steps.check-changes.outputs.has_changes == 'true'
        id: get-info
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_AUTHOR: ${{ github.event.release.author.login }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" == "release" ]; then
            VERSION="$RELEASE_TAG"
            AUTHOR="$RELEASE_AUTHOR"
          elif [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            # Get the latest release tag
            LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
            if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" == "null" ]; then
              echo "No releases found"
              exit 1
            fi
            VERSION="$LATEST_TAG"
            AUTHOR="$GITHUB_ACTOR"
          else
            echo "Unsupported event: $EVENT_NAME with ref: $GITHUB_REF"
            exit 1
          fi
          
          # Sanitize version for branch name (remove invalid characters)
          SAFE_VERSION=$(echo "$VERSION" | sed 's/[^a-zA-Z0-9.-]/-/g')
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "safe_version=${SAFE_VERSION}" >> $GITHUB_OUTPUT
          echo "author=${AUTHOR}" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          base: main
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update documentation and libsonnet for ${{ steps.get-info.outputs.version }}"
          title: "📚 Update documentation and libsonnet for ${{ steps.get-info.outputs.version }}"
          body: |
            ## 📚 Documentation and Libsonnet Update for ${{ steps.get-info.outputs.version }}
            
            This PR updates the documentation and generates the libsonnet library for the new version ${{ steps.get-info.outputs.version }}.
            
            ### Changes
            - Updated CLI command documentation
            - Updated version references across all docs
            - Updated Docker image tags in examples
            - Generated versioned libsonnet library for deployment_tools
            
            Generated automatically by:
            - `go run ./generators/doc -o docs`
            - `go run ./generators/libsonnet -o libsonnet`
            
            🤖 This PR was created automatically when version ${{ steps.get-info.outputs.version }} was released.
            
            /cc @${{ steps.get-info.outputs.author }}
          branch: docs/update-${{ steps.get-info.outputs.safe_version }}
          branch-suffix: short-commit-hash
          delete-branch: true
          assignees: ${{ steps.get-info.outputs.author }}
          labels: |
            documentation
            automated
