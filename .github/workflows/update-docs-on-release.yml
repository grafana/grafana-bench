name: Update docs on release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Fetch all history for tags

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate updated documentation
        run: go run ./gendoc -o docs

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet docs/; then
            echo "No documentation changes needed"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Documentation changes detected"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Get version and author info
        if: steps.check-changes.outputs.has_changes == 'true'
        id: get-info
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            AUTHOR="${{ github.event.release.author.login }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
            AUTHOR="${{ github.actor }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "author=${AUTHOR}" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update documentation for ${{ steps.get-info.outputs.version }}"
          title: "📚 Update documentation for ${{ steps.get-info.outputs.version }}"
          body: |
            ## 📚 Documentation Update for ${{ steps.get-info.outputs.version }}
            
            This PR updates the documentation to reflect the new version ${{ steps.get-info.outputs.version }}.
            
            ### Changes
            - Updated CLI command documentation
            - Updated version references across all docs
            - Updated Docker image tags in examples
            
            Generated automatically by `go run ./gendoc -o docs`
            
            🤖 This PR was created automatically when version ${{ steps.get-info.outputs.version }} was released.
            
            /cc @${{ steps.get-info.outputs.author }}
          branch: docs/update-${{ steps.get-info.outputs.version }}
          branch-suffix: short-commit-hash
          delete-branch: true
          assignees: ${{ steps.get-info.outputs.author }}
          labels: |
            documentation
            automated