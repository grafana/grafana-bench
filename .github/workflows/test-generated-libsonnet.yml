name: Test Generated Libsonnet
permissions:
  contents: read

on:
  pull_request:
    paths: 
      - 'libsonnet/**'
      - 'generators/libsonnet/**'
      - '.github/workflows/test-generated-libsonnet.yml'
  push:
    branches: [main]
    paths:
      - 'libsonnet/**' 
      - 'generators/libsonnet/**'
      - '.github/workflows/test-generated-libsonnet.yml'
  workflow_dispatch:

jobs:
  test-libsonnet-generation:
    name: Test Libsonnet Generation and Functions
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: 'go.mod'

      - name: Test libsonnet generator Go code
        run: |
          cd generators/libsonnet
          go test -v ./...

      - name: Generate libsonnet and run function tests
        run: |
          # This runs the generator and validates the output with unit tests
          make libsonnet

      - name: Verify all three files are generated
        run: |
          echo "📋 Checking generated files:"
          ls -la libsonnet/
          
          # Verify the three expected files exist
          test -f libsonnet/bench.libsonnet
          test -f libsonnet/bench_functions.libsonnet  
          test -f libsonnet/bench_functions_test.jsonnet
          
          echo "✅ All three libsonnet files generated successfully"

      - name: Show test results summary
        run: |
          echo "🧪 Libsonnet function test results:"
          cd libsonnet && jsonnet bench_functions_test.jsonnet | jq '.summary'