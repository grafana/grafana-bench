name: Test Generated Libsonnet
permissions:
  contents: read

on:
  pull_request:
    paths: 
      - 'libsonnet/**'
      - 'generators/libsonnet/**'
      - '.github/workflows/test-generated-libsonnet.yml'
  push:
    branches: [main]
    paths:
      - 'libsonnet/**' 
      - 'generators/libsonnet/**'
      - '.github/workflows/test-generated-libsonnet.yml'
  workflow_dispatch:

jobs:
  test-conversion:
    name: Test Libsonnet Conversion
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: 'go.mod'

      - name: Install jsonnet
        run: |
          # Install jsonnet binary (same as deployment_tools uses)
          go install github.com/google/go-jsonnet/cmd/jsonnet@latest
          go install github.com/google/go-jsonnet/cmd/jsonnetfmt@latest

      - name: Run conversion tests
        run: |
          cd generators/libsonnet
          go test -v ./...

  test-integration:
    name: Test Against Live Grafana
    runs-on: ubuntu-latest
    needs: test-conversion
    
    services:
      grafana:
        image: grafana/grafana:12.2.1
        ports:
          - 3000:3000
        env:
          GF_SECURITY_ADMIN_PASSWORD: admin
          GF_SECURITY_ADMIN_USER: admin
        options: >-
          --health-cmd="curl -f http://localhost:3000/api/health"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: 'go.mod'

      - name: Build bench
        run: go build -o bench bench.go

      - name: Install development dependencies
        run: make install-deps

      - name: Wait for Grafana to be ready
        run: |
          echo "Waiting for Grafana to be fully ready..."
          for i in {1..30}; do
            if curl -f -s http://localhost:3000/api/health > /dev/null; then
              echo "Grafana is ready!"
              break
            fi
            echo "Attempt $i: Grafana not ready yet, waiting..."
            sleep 10
          done
          
          # Verify we can actually log in
          curl -f -u admin:admin http://localhost:3000/api/org

      - name: Test generated libsonnet end-to-end with Argo workflow validation
        run: |
          # Install Argo Workflows CLI
          echo "📦 Installing Argo Workflows CLI..."
          ARGO_VERSION="v3.7.3"
          curl -sLO "https://github.com/argoproj/argo-workflows/releases/download/${ARGO_VERSION}/argo-linux-amd64.gz"
          gunzip argo-linux-amd64.gz
          chmod +x argo-linux-amd64
          sudo mv argo-linux-amd64 /usr/local/bin/argo
          argo version --short
          
          # Generate libsonnet with test version
          echo "🔧 Generating libsonnet..."
          cd generators/libsonnet
          go run main.go -o ../../test-output -version v1.0.0-test
          cd ../..
          
          # Create a test jsonnet file that uses the generated libsonnet
          echo "📝 Creating test workflow using generated libsonnet..."
          cat > test-workflow.jsonnet << 'EOF'
          local bench = import 'test-output/bench.libsonnet';
          
          // Create an Argo workflow that uses the bench libsonnet
          {
            apiVersion: 'argoproj.io/v1alpha1',
            kind: 'Workflow',
            metadata: {
              name: 'bench-smoke-test',
              namespace: 'default',
            },
            spec: {
              entrypoint: 'bench-test',
              templates: [
                bench('bench-step').withBenchTest('http://localhost:3000', {
                  testRunner: 'k6',
                  path: 'CI/k6',
                  type: 'smoke',
                })
              ]
            }
          }
          EOF
          
          # Generate Argo workflow YAML using jsonnet
          echo "⚙️  Generating Argo workflow YAML..."
          jsonnet -J . test-workflow.jsonnet > generated-workflow.yaml
          
          # Display the generated workflow for debugging
          echo "📄 Generated workflow:"
          cat generated-workflow.yaml
          
          # Validate the generated YAML with Argo CLI
          echo "✅ Validating workflow with Argo CLI..."
          argo lint --offline --strict --kinds=workflows generated-workflow.yaml
          
          echo "🎉 End-to-end Argo workflow validation completed successfully!"
        env:
          GRAFANA_URL: http://localhost:3000
          GRAFANA_ADMIN_USER: admin 
          GRAFANA_ADMIN_PASSWORD: admin

  validate-pr-ready:
    name: Validate PR Ready for deployment_tools
    runs-on: ubuntu-latest
    needs: [test-conversion, test-integration]
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Check if libsonnet changes are tested
        run: |
          echo "✅ Libsonnet conversion tests passed"
          echo "✅ Integration tests with live Grafana passed" 
          echo "✅ Generated libsonnet is ready for deployment_tools PR"
          
          # In the future, this could automatically create/update the deployment_tools PR
          # if both test suites pass