name: build publish slim image

on:
  workflow_call:
    secrets:
      SUITE_REPO_TOKEN:
        required: true

jobs:
  test-container-base:
    runs-on: ubuntu-x64-2xlarge

    # run local registry that buildx can push to
    services:
      registry:
        image: registry:3@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
        ports:
          - 5000:5000
      grafana:
        image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
        ports:
          - 3000:3000

    env:
      DOCKER_CLI_EXPERIMENTAL: enabled
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: get short sha
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c 1-7)" >> $GITHUB_ENV
      - name: build dev container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.dev
          build-args: |-
            BENCH_REVISION=${{ env.SHORT_SHA }}
          load: true
          tags: localhost:5000/grafana-bench-test-dev:latest

      - name: build prod container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          build-args: |-
            BENCH_REVISION=${{ env.SHORT_SHA }}
          load: true
          tags: localhost:5000/grafana-bench-test:latest

      - name: check Grafana instance
        run: |
          curl http://localhost:3000

      - name: mount and run k6 tests  in dev container (FIXUID)
        run: |
          docker run --rm --network=host --volume="./CI/:/tests/CI/" \
             localhost:5000/grafana-bench-test-dev:latest test \
              --config "/tests/CI/k6.yaml"

  publish-dev-base:
    # publish dev images from main to dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-container-base]
    runs-on: ubuntu-x64-2xlarge
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: get short sha
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c 1-7)" >> $GITHUB_ENV
      - name: Log into ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: grafana/shared-workflows/actions/push-to-gar-docker@de81a07e6f6718fb289c7a4612c9c514c28bd798 # v0.4.1
        id: push-to-gar-dev
        with:
          environment: "dev"
          file: Dockerfile.dev
          image_name: grafana-bench
          platforms: linux/amd64,linux/arm64
          build-args: |-
            BENCH_REVISION=${{ env.SHORT_SHA }}
          tags: |-
            dev-${{ env.SHORT_SHA }}
            dev-latest
      - name: copy dev image to ghcr.io
        run: |
          # this is a multi-line string, so just use the first
          GAR_IMAGE=$(echo "${{ steps.push-to-gar-dev.outputs.tags }}" | head -n1)
          echo "GAR_IMAGE=$GAR_IMAGE"

          GHCR_IMAGE=ghcr.io/grafana/grafana-bench:${{ steps.push-to-gar-dev.outputs.version }}
          echo "GHCR_IMAGE=$GHCR_IMAGE"

          docker buildx imagetools create \
            --tag $GHCR_IMAGE \
            $GAR_IMAGE

  publish-prod-base:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [test-container-base]
    runs-on: ubuntu-x64-2xlarge
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Log into ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: grafana/shared-workflows/actions/push-to-gar-docker@de81a07e6f6718fb289c7a4612c9c514c28bd798 # v0.4.1
        id: push-to-gar-prod
        with:
          environment: "prod"
          file: Dockerfile
          image_name: grafana-bench
          platforms: linux/amd64,linux/arm64
          build-args: |-
            BENCH_REVISION=${{ github.ref_name }}
          tags: |-
            ${{ github.ref_name }}
            ${{ env.SHORT_SHA }}
            latest
      - name: copy prod image to ghcr.io
        run: |
          GAR_IMAGE=$(echo "${{ steps.push-to-gar-prod.outputs.tags }}" | head -n1)
          echo "GAR_IMAGE=$GAR_IMAGE"

          GHCR_IMAGE=ghcr.io/grafana/grafana-bench:${{ steps.push-to-gar-prod.outputs.version }}
          echo "GHCR_IMAGE=$GHCR_IMAGE"

          GHCR_IMAGE_LATEST=ghcr.io/grafana/grafana-bench:latest
          echo "GHCR_IMAGE_LATEST=$GHCR_IMAGE_LATEST"

          docker buildx imagetools create \
            --tag $GHCR_IMAGE --tag $GHCR_IMAGE_LATEST \
            $GAR_IMAGE
