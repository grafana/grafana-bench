name: update bench libsonnet

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to use ("experimental" for main branch or actual version like "v1.2.3")'
        required: true
        type: string
      branch_prefix:
        description: 'PR branch prefix'
        required: true
        type: string
      pr_message:
        description: 'Pull request message'
        required: true
        type: string
      commit_message:
        description: 'Commit message'
        required: true
        type: string
      base_image_url:
        description: 'Base bench image URL'
        required: false
        type: string
        default: 'us-docker.pkg.dev/grafanalabs-global/docker-grafana-bench-prod/grafana-bench'
      playwright_image_url:
        description: 'Playwright bench image URL'
        required: false
        type: string
        default: 'us-docker.pkg.dev/grafanalabs-global/docker-grafana-bench-prod/grafana-bench-playwright'
      test_version_sha:
        description: 'Override version SHA to check for in metrics (for testing - defaults to current commit)'
        required: false
        type: string

jobs:
  update-libsonnet:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: setup go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: install development dependencies
        run: make install-deps

      - name: Get GitHub App token
        id: get-github-app-token
        uses: grafana/shared-workflows/actions/create-github-app-token@580590a644e82e79bb2598bdaba0be245a14dda0 # create-github-app-token/v0.2.2
        with:
          github_app: updater-for-ci
          permission_set: update-libsonnet

      - name: generate libsonnet
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ steps.get-github-app-token.outputs.token }}
        run: |
          # Generate main libsonnet files and versions.libsonnet using make (with remote fetching)
          make libsonnet-fetch TARGET_VERSION="$VERSION"

      - name: validate generated versions.libsonnet
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # For versioned releases use the version string; for experimental use the commit SHA
          if [ "$VERSION" = "experimental" ]; then
            EXPECTED_LABEL=$(git rev-parse HEAD)
          else
            EXPECTED_LABEL="$VERSION"
          fi
          echo "Expected label: $EXPECTED_LABEL"

          GENERATED_LABEL=$(jsonnet -e "local versions = import 'libsonnet/versions.libsonnet'; versions.latestVersionSha" | tr -d '"')
          echo "Generated label in versions.libsonnet: $GENERATED_LABEL"

          if [ "$EXPECTED_LABEL" != "$GENERATED_LABEL" ]; then
            echo "❌ Label mismatch! Expected: $EXPECTED_LABEL, Got: $GENERATED_LABEL"
            echo "This indicates a problem with the libsonnet generation process."
            exit 1
          else
            echo "✅ Label validation passed: Generated libsonnet contains correct label"
          fi

      - name: authenticate with gar
        uses: grafana/shared-workflows/actions/login-to-gar@979bc5d3fd4ea82383d3f1362c34041687c74304
        with:
          registry: us-docker.pkg.dev

      # Temporarily disabled for testing - re-enable after verifying workflow changes
      # - name: Validate generated images exist
      #   env:
      #     VERSION: ${{ inputs.version }}
      #   run: |
      #     echo "🔍 Validating that generated libsonnet images exist in repositories..."
      #     
      #     # Extract image URLs from the generated libsonnet and strip quotes
      #     BASE_IMAGE=$(jsonnet -e "local lib = import 'libsonnet/${VERSION}/main.libsonnet'; lib.selectImage('k6')" | tr -d '"')
      #     PLAYWRIGHT_IMAGE=$(jsonnet -e "local lib = import 'libsonnet/${VERSION}/main.libsonnet'; lib.selectImage('playwright')" | tr -d '"')
      #     
      #     echo "Checking base image: $BASE_IMAGE"
      #     docker manifest inspect "$BASE_IMAGE" > /dev/null || {
      #       echo "❌ Base image not found: $BASE_IMAGE"
      #       exit 1
      #     }
      #     echo "✅ Base image exists: $BASE_IMAGE"
      #     
      #     echo "Checking playwright image: $PLAYWRIGHT_IMAGE"  
      #     docker manifest inspect "$PLAYWRIGHT_IMAGE" > /dev/null || {
      #       echo "❌ Playwright image not found: $PLAYWRIGHT_IMAGE"
      #       exit 1
      #     }
      #     echo "✅ Playwright image exists: $PLAYWRIGHT_IMAGE"
      #     
      #     echo "🎉 All generated images validated successfully!"

      - name: update deployment_tools with libsonnet
        env:
          VERSION: ${{ inputs.version }}
          BRANCH_PREFIX: ${{ inputs.branch_prefix }}
          PR_MESSAGE: ${{ inputs.pr_message }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
          PR_REVIEWER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ steps.get-github-app-token.outputs.token }}
        run: |
          set -euo pipefail

          # Create PR title based on version type
          if [ "$VERSION" == "experimental" ]; then
            # Get short SHA for experimental releases
            SHORT_SHA=$(git rev-parse --short HEAD)
            PR_TITLE="[CI/CD] Update experimental($SHORT_SHA) bench libsonnet"
          else
            # Use version for releases
            PR_TITLE="Release $VERSION bench libsonnet"
          fi
          echo "Using PR title: $PR_TITLE"

          # Pull the updater Docker image
          docker pull us-docker.pkg.dev/grafanalabs-global/docker-deployment-tools-prod/updater

          # Create config.json for libsonnet update using environment variables
          cat << EOF > config.json
          {
            "repo_owner": "grafana",
            "repo_name": "deployment_tools",
            "git_author_name": "updater-for-ci[bot]",
            "git_author_email": "119986603+updater-for-ci[bot]@users.noreply.github.com",
            "git_committer_name": "updater-for-ci[bot]",
            "git_committer_email": "119986603+updater-for-ci[bot]@users.noreply.github.com",
            "destination_branch": "master",
            "pull_request_enabled": true,
            "pull_request_branch_prefix": "${BRANCH_PREFIX}",
            "pull_request_existing_strategy": "replace",
            "pull_request_title": "${PR_TITLE}",
            "pull_request_message": "${PR_MESSAGE}",
            "pull_request_reviewers": ["${PR_REVIEWER}"],
            "pull_request_assignees": ["${PR_REVIEWER}"],
            "commit_message": "${COMMIT_MESSAGE}",
            "pre_update_commands": [
              {
                "description": "Create directory structure for bench libsonnet",
                "command": "mkdir -p ksonnet/lib/bench/${VERSION}"
              },
              {
                "description": "Copy libsonnet main function file",
                "command": "cp /workspace/libsonnet/${VERSION}/main.libsonnet ksonnet/lib/bench/${VERSION}/main.libsonnet"
              },
              {
                "description": "Copy libsonnet test file",
                "command": "cp /workspace/libsonnet/${VERSION}/main_test.jsonnet ksonnet/lib/bench/${VERSION}/main_test.jsonnet"
              },
              {
                "description": "Copy versions.libsonnet file",
                "command": "cp /workspace/libsonnet/versions.libsonnet ksonnet/lib/bench/versions.libsonnet"
              },
              {
                "description": "Copy versions_test.jsonnet file",
                "command": "cp /workspace/libsonnet/versions_test.jsonnet ksonnet/lib/bench/versions_test.jsonnet"
              }
            ]
          }
          EOF

          # Run the Docker-based updater tool
          docker run --rm \
            -v "$(pwd):/workspace:ro" \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            -e CONFIG_JSON="$(cat config.json)" \
            us-docker.pkg.dev/grafanalabs-global/docker-deployment-tools-prod/updater |& tee updater-output.log

          echo "Libsonnet update completed for ${VERSION}!"

      - name: get vault secrets for prometheus monitoring
        uses: grafana/shared-workflows/actions/get-vault-secrets@979bc5d3fd4ea82383d3f1362c34041687c74304
        with:
          repo_secrets: |
            PROMETHEUS_URL=prometheus_url:prometheus_url
            PROMETHEUS_USER=prometheus_user:prometheus_user
            PROMETHEUS_TOKEN=prometheus_token:prometheus_token

      - name: wait for deployment metrics to appear
        env:
          VERSION: ${{ inputs.version }}
          TEST_VERSION_SHA: ${{ inputs.test_version_sha }}
        run: |
          set -euo pipefail

          if [ -n "$TEST_VERSION_SHA" ]; then
            TARGET_SHA="$TEST_VERSION_SHA"
          elif [ "$VERSION" != "experimental" ]; then
            TARGET_SHA="$VERSION"
          else
            TARGET_SHA=$(git rev-parse HEAD)
          fi

          TIMEOUT_SECONDS=2700  # 45 minutes; covers libsonnet PR auto-merge + kube-manifests-exporter + flux + scrape
          POLL_INTERVAL=10

          QUERY="argo_resource_info{exported_namespace=\"grafana-bench-cd\", version=\"$TARGET_SHA\"}"
          # PROMETHEUS_URL is the bare hostname; the Mimir Cortex-compat PromQL endpoint lives at /api/prom/api/v1/query.
          PROM_QUERY_URL="${PROMETHEUS_URL}/api/prom/api/v1/query"

          echo "Target SHA: $TARGET_SHA"
          echo "Query: $QUERY"
          echo "URL: $PROM_QUERY_URL"
          echo "Timeout: ${TIMEOUT_SECONDS}s, polling every ${POLL_INTERVAL}s"
          echo ""

          ELAPSED=0
          ATTEMPT=0
          while [ "$ELAPSED" -lt "$TIMEOUT_SECONDS" ]; do
            ATTEMPT=$((ATTEMPT + 1))

            RESPONSE=$(mktemp)
            HTTP_STATUS=$(curl -sS -G -o "$RESPONSE" -w "%{http_code}" "$PROM_QUERY_URL" \
              --data-urlencode "query=$QUERY" \
              -u "$PROMETHEUS_USER:$PROMETHEUS_TOKEN" || echo "000")

            COUNT=0
            if [ "$HTTP_STATUS" = "200" ]; then
              COUNT=$(jq -r '.data.result | length // 0' "$RESPONSE" 2>/dev/null || echo "0")
            fi

            if [ "$COUNT" -gt 0 ]; then
              echo "✅ Found $COUNT metric(s) for version $TARGET_SHA after ${ELAPSED}s (HTTP $HTTP_STATUS)"
              rm -f "$RESPONSE"
              exit 0
            fi

            # Auth or path failures won't get better by waiting — fail fast with the body so it's debuggable.
            case "$HTTP_STATUS" in
              401|403|404)
                echo "❌ Prometheus query failed with HTTP $HTTP_STATUS (URL: $PROM_QUERY_URL)"
                echo "Response (first 500 chars):"
                head -c 500 "$RESPONSE"; echo
                rm -f "$RESPONSE"
                exit 1
                ;;
            esac

            # Log status on the first attempt and once per minute thereafter; include a snippet on non-200.
            if [ "$ATTEMPT" = "1" ] || [ "$((ATTEMPT % 6))" = "0" ]; then
              echo "⏳ Attempt $ATTEMPT (${ELAPSED}s): HTTP $HTTP_STATUS, $COUNT results"
              if [ "$HTTP_STATUS" != "200" ]; then
                echo "  Response (first 300 chars):"
                head -c 300 "$RESPONSE" | sed 's/^/  /'; echo
              fi
            fi

            rm -f "$RESPONSE"
            sleep "$POLL_INTERVAL"
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

          echo "❌ Timeout: No matching metric after ${TIMEOUT_SECONDS}s"
          exit 1

      - name: setup argo
        uses: grafana/shared-workflows/actions/setup-argo@979bc5d3fd4ea82383d3f1362c34041687c74304

      - name: trigger grafana-bench-cd workflow
        id: trigger-workflow
        env:
          VERSION: ${{ inputs.version }}
        uses: grafana/shared-workflows/actions/trigger-argo-workflow@979bc5d3fd4ea82383d3f1362c34041687c74304
        with:
          instance: "ops"
          namespace: "grafana-bench-cd"
          workflow_template: "grafana-bench-cd"
          parameters: |
            commit=${{ github.sha }}
            commit_link=https://github.com/grafana/grafana-bench/commit/${{ github.sha }}
            branch=${{ github.ref_name }}
            benchVersion=${{ inputs.version }}

      - name: monitor workflow status
        env:
          VERSION: ${{ inputs.version }}
        run: |
          WORKFLOW_URI="${{ steps.trigger-workflow.outputs.uri }}"
          echo "Workflow URI: $WORKFLOW_URI"
          
          # Extract workflow name from URI (remove namespace prefix)
          WORKFLOW_NAME=$(echo "$WORKFLOW_URI" | sed 's/.*\/workflows\///' | cut -d'?' -f1 | sed 's/.*\///')
          echo "Monitoring workflow: $WORKFLOW_NAME"
          
          API_URL="https://argo-workflows.grafana.net/api/v1/workflows/grafana-bench-cd/$WORKFLOW_NAME"
          
          # Poll workflow status until completion (30 minute timeout)
          for i in {1..60}; do
            echo "Attempt $i: checking workflow status..."
            
            RESPONSE=$(curl -s -w "HTTP_STATUS:%{http_code}" \
              -H "Authorization: Bearer ${{ env.ARGO_TOKEN }}" \
              "$API_URL")
            
            HTTP_STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
            BODY=$(echo "$RESPONSE" | sed 's/HTTP_STATUS:[0-9]*$//')
            
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "❌ API request failed with status $HTTP_STATUS"
              exit 1
            fi
            
            STATUS=$(echo "$BODY" | jq -r '.status.phase // "Unknown"')
            echo "Status: $STATUS"
            
            case "$STATUS" in
              "Succeeded")
                echo "✅ grafana-bench-cd workflow completed successfully!"
                echo "🎉 Bench testing completed for version $VERSION"
                exit 0
                ;;
              "Failed"|"Error")
                echo "❌ grafana-bench-cd workflow failed"
                exit 1
                ;;
              "Running"|"Pending")
                echo "⏳ Workflow still running, waiting 30 seconds..."
                sleep 30
                ;;
              *)
                echo "⚠️ Unknown status: $STATUS, waiting 30 seconds..."
                sleep 30
                ;;
            esac
          done
          
          echo "⏰ Workflow monitoring timeout after 30 minutes"
          exit 1
