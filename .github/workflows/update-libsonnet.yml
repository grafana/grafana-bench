name: update bench libsonnet

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to use ("experimental" for main branch or actual version like "v1.2.3")'
        required: true
        type: string
      branch_prefix:
        description: 'PR branch prefix'
        required: true
        type: string
      pr_message:
        description: 'Pull request message'
        required: true
        type: string
      commit_message:
        description: 'Commit message'
        required: true
        type: string
      base_image_url:
        description: 'Base bench image URL'
        required: false
        type: string
        default: 'us-docker.pkg.dev/grafanalabs-global/docker-grafana-bench-prod/grafana-bench'
      playwright_image_url:
        description: 'Playwright bench image URL'
        required: false
        type: string
        default: 'us-docker.pkg.dev/grafanalabs-global/docker-grafana-bench-prod/grafana-bench-playwright'
      test_version_sha:
        description: 'Override version SHA to check for in metrics (for testing - defaults to current commit)'
        required: false
        type: string

jobs:
  update-libsonnet:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: install development dependencies
        run: make install-deps

      - name: generate libsonnet
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Generate main libsonnet files and versions.libsonnet using make
          make libsonnet VERSION="$VERSION"

      - name: validate generated versions.libsonnet
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          echo "Current SHA: $CURRENT_SHA"
          
          # Extract latestVersionSha from generated versions.libsonnet
          GENERATED_SHA=$(jsonnet -e "local versions = import 'libsonnet/versions.libsonnet'; versions.latestVersionSha" | tr -d '"')
          echo "Generated SHA in versions.libsonnet: $GENERATED_SHA"
          
          if [ "$CURRENT_SHA" != "$GENERATED_SHA" ]; then
            echo "❌ SHA mismatch! Expected: $CURRENT_SHA, Got: $GENERATED_SHA"
            echo "This indicates a problem with the libsonnet generation process."
            exit 1
          else
            echo "✅ SHA validation passed: Generated libsonnet contains correct SHA"
          fi

      - name: authenticate with gar
        uses: grafana/shared-workflows/actions/login-to-gar@ae92934a14a48b94494dbc06d74a81d47fe08a40
        with:
          registry: us-docker.pkg.dev

      # Temporarily disabled for testing - re-enable after verifying workflow changes
      # - name: Validate generated images exist
      #   env:
      #     VERSION: ${{ inputs.version }}
      #   run: |
      #     echo "🔍 Validating that generated libsonnet images exist in repositories..."
      #     
      #     # Extract image URLs from the generated libsonnet and strip quotes
      #     BASE_IMAGE=$(jsonnet -e "local lib = import 'libsonnet/${VERSION}/main.libsonnet'; lib.selectImage('k6')" | tr -d '"')
      #     PLAYWRIGHT_IMAGE=$(jsonnet -e "local lib = import 'libsonnet/${VERSION}/main.libsonnet'; lib.selectImage('playwright')" | tr -d '"')
      #     
      #     echo "Checking base image: $BASE_IMAGE"
      #     docker manifest inspect "$BASE_IMAGE" > /dev/null || {
      #       echo "❌ Base image not found: $BASE_IMAGE"
      #       exit 1
      #     }
      #     echo "✅ Base image exists: $BASE_IMAGE"
      #     
      #     echo "Checking playwright image: $PLAYWRIGHT_IMAGE"  
      #     docker manifest inspect "$PLAYWRIGHT_IMAGE" > /dev/null || {
      #       echo "❌ Playwright image not found: $PLAYWRIGHT_IMAGE"
      #       exit 1
      #     }
      #     echo "✅ Playwright image exists: $PLAYWRIGHT_IMAGE"
      #     
      #     echo "🎉 All generated images validated successfully!"

      - name: get vault secrets for deployment_tools access
        uses: grafana/shared-workflows/actions/get-vault-secrets@ae92934a14a48b94494dbc06d74a81d47fe08a40
        with:
          common_secrets: |
            GITHUB_APP_ID=updater-app:app-id
            GITHUB_APP_INSTALLATION_ID=updater-app:app-installation-id
            GITHUB_APP_PRIVATE_KEY=updater-app:private-key

      - name: update deployment_tools with libsonnet
        env:
          VERSION: ${{ inputs.version }}
          BRANCH_PREFIX: ${{ inputs.branch_prefix }}
          PR_MESSAGE: ${{ inputs.pr_message }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
          PR_REVIEWER: ${{ github.actor }}
        run: |
          set -euo pipefail

          # Create PR title based on version type
          if [ "$VERSION" == "experimental" ]; then
            # Get short SHA for experimental releases
            SHORT_SHA=$(git rev-parse --short HEAD)
            PR_TITLE="[CI/CD] Update experimental($SHORT_SHA) bench libsonnet"
          else
            # Use version for releases
            PR_TITLE="Release $VERSION bench libsonnet"
          fi
          echo "Using PR title: $PR_TITLE"

          # Pull the updater Docker image
          docker pull us-docker.pkg.dev/grafanalabs-global/docker-deployment-tools-prod/updater

          # Create config.json for libsonnet update using environment variables
          cat << EOF > config.json
          {
            "repo_owner": "grafana",
            "repo_name": "deployment_tools",
            "destination_branch": "master",
            "pull_request_enabled": true,
            "pull_request_branch_prefix": "${BRANCH_PREFIX}",
            "pull_request_existing_strategy": "ignore",
            "pull_request_title": "${PR_TITLE}",
            "pull_request_message": "${PR_MESSAGE}",
            "pull_request_reviewers": ["${PR_REVIEWER}"],
            "pull_request_assignees": ["${PR_REVIEWER}"],
            "commit_message": "${COMMIT_MESSAGE}",
            "pre_update_commands": [
              {
                "description": "Create directory structure for bench libsonnet",
                "command": "mkdir -p ksonnet/lib/bench/${VERSION}"
              },
              {
                "description": "Copy libsonnet main function file",
                "command": "cp /workspace/libsonnet/${VERSION}/main.libsonnet ksonnet/lib/bench/${VERSION}/main.libsonnet"
              },
              {
                "description": "Copy libsonnet test file",
                "command": "cp /workspace/libsonnet/${VERSION}/main_test.jsonnet ksonnet/lib/bench/${VERSION}/main_test.jsonnet"
              },
              {
                "description": "Copy or regenerate versions files",
                "command": "if [ -f /workspace/libsonnet/versions.libsonnet ]; then cp /workspace/libsonnet/versions.libsonnet ksonnet/lib/bench/versions.libsonnet && cp /workspace/libsonnet/versions_test.jsonnet ksonnet/lib/bench/versions_test.jsonnet && echo 'Copied pre-generated versions files'; else echo 'No pre-generated versions files (experimental release - versions file unchanged)'; fi"
              }
            ]
          }
          EOF

          # Run the Docker-based updater tool
          docker run --rm \
            -v "$(pwd):/workspace:ro" \
            -e GITHUB_APP_ID="$GITHUB_APP_ID" \
            -e GITHUB_APP_INSTALLATION_ID="$GITHUB_APP_INSTALLATION_ID" \
            -e GITHUB_APP_PRIVATE_KEY="$GITHUB_APP_PRIVATE_KEY" \
            -e CONFIG_JSON="$(cat config.json)" \
            us-docker.pkg.dev/grafanalabs-global/docker-deployment-tools-prod/updater |& tee updater-output.log

          echo "Libsonnet update completed for ${VERSION}!"

      - name: get vault secrets for prometheus monitoring
        uses: grafana/shared-workflows/actions/get-vault-secrets@ae92934a14a48b94494dbc06d74a81d47fe08a40
        with:
          repo_secrets: |
            PROMETHEUS_URL=prometheus_url:prometheus_url
            PROMETHEUS_USER=prometheus_user:prometheus_user
            PROMETHEUS_TOKEN=prometheus_token:prometheus_token

      - name: wait for deployment metrics to appear
        env:
          VERSION: ${{ inputs.version }}
          TEST_VERSION_SHA: ${{ inputs.test_version_sha }}
        run: |
          set -euo pipefail
          
          echo "🔍 Waiting for deployment metrics to appear in Prometheus..."
          
          # Use test version SHA if provided, otherwise use current commit
          if [ -n "$TEST_VERSION_SHA" ]; then
            TARGET_SHA="$TEST_VERSION_SHA"
            echo "Using test version SHA: $TARGET_SHA"
          else
            TARGET_SHA=$(git rev-parse HEAD)
            echo "Using current commit SHA: $TARGET_SHA"
          fi
          
          echo "Waiting for metrics with version SHA: $TARGET_SHA"
          
          # Prometheus query to check for the specific version
          QUERY="argo_resource_info{exported_namespace=\"grafana-bench-cd\", version=\"$TARGET_SHA\"}"
          
          # Wait up to 30 minutes for the metric to appear
          TIMEOUT_SECONDS=1800  # 30 minutes
          POLL_INTERVAL=10      # 10 seconds
          ELAPSED=0
          
          echo "Polling Prometheus every ${POLL_INTERVAL}s for up to ${TIMEOUT_SECONDS}s..."
          echo "Query: $QUERY"
          
          while [ $ELAPSED -lt $TIMEOUT_SECONDS ]; do
            echo "⏳ Attempt $(($ELAPSED / $POLL_INTERVAL + 1)): Checking for metrics..."
            
            # Query Prometheus with debug output
            echo "🔍 Debug: Querying $PROMETHEUS_URL/prometheus/api/v1/query"
            echo "🔍 Debug: Query = $QUERY"
            
            PROMETHEUS_RESPONSE=$(curl -s -G "$PROMETHEUS_URL/prometheus/api/v1/query" \
              --data-urlencode "query=$QUERY" \
              -u "$PROMETHEUS_USER:$PROMETHEUS_TOKEN")
            
            echo "🔍 Debug: Raw Prometheus response:"
            echo "$PROMETHEUS_RESPONSE" | jq '.' 2>/dev/null || echo "$PROMETHEUS_RESPONSE"
            
            RESULT_COUNT=$(echo "$PROMETHEUS_RESPONSE" | jq -r '.data.result | length' 2>/dev/null || echo "0")
            
            if [ "$RESULT_COUNT" -gt "0" ]; then
              echo "✅ Success! Found $RESULT_COUNT metric(s) with version $TARGET_SHA"
              echo "🎉 Deployment has been detected in monitoring system"
              exit 0
            fi
            
            echo "   No metrics found yet (result count: $RESULT_COUNT)"
            sleep $POLL_INTERVAL
            ELAPSED=$(($ELAPSED + $POLL_INTERVAL))
          done
          
          echo "❌ Timeout: No metrics found after ${TIMEOUT_SECONDS}s"
          echo "This may indicate the deployment hasn't propagated to monitoring yet"
          echo "Manual verification recommended using:"
          echo "  Query: $QUERY"
          echo "  URL: $PROMETHEUS_URL/prometheus/api/v1/query"
          exit 1

      - name: get vault secrets for argo workflows
        uses: grafana/shared-workflows/actions/get-vault-secrets@ae92934a14a48b94494dbc06d74a81d47fe08a40
        with:
          common_secrets: |
            ARGO_SERVER=argo-workflows:server
            ARGO_TOKEN=argo-workflows:token

      - name: trigger grafana-bench-cd workflow
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          
          echo "🚀 Triggering grafana-bench-cd Argo workflow..."
          
          # Get the current commit SHA and create commit link
          CURRENT_SHA=$(git rev-parse HEAD)
          COMMIT_LINK="https://github.com/grafana/grafana-bench/commit/$CURRENT_SHA"
          
          echo "Triggering workflow for:"
          echo "  Version: $VERSION"
          echo "  Commit SHA: $CURRENT_SHA"
          echo "  Commit Link: $COMMIT_LINK"
          
          # Submit the workflow
          WORKFLOW_NAME=$(argo submit \
            -n grafana-bench-cd \
            --from workflowtemplate/grafana-bench-cd \
            --server-dry-run \
            --output name 2>/dev/null | head -1)
          
          if [ -z "$WORKFLOW_NAME" ]; then
            echo "❌ Failed to get workflow name from dry-run"
            exit 1
          fi
          
          echo "Generated workflow name: $WORKFLOW_NAME"
          
          # Submit the actual workflow
          echo "📋 Submitting workflow..."
          argo submit \
            -n grafana-bench-cd \
            --from workflowtemplate/grafana-bench-cd \
            --wait \
            --log
          
          SUBMIT_EXIT_CODE=$?
          
          if [ $SUBMIT_EXIT_CODE -eq 0 ]; then
            echo "✅ grafana-bench-cd workflow completed successfully!"
            echo "🎉 Bench testing completed for version $VERSION"
          else
            echo "❌ grafana-bench-cd workflow failed (exit code: $SUBMIT_EXIT_CODE)"
            echo "Check the workflow logs above for details"
            exit 1
          fi
