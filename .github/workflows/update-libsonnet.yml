name: Update bench libsonnet

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to use ("experimental" for main branch or actual version like "v1.2.3")'
        required: true
        type: string
      target_dir:
        description: 'Target directory in deployment_tools (e.g. "bench/v1.2.3" or "bench/experimental")'
        required: true
        type: string
      branch_prefix:
        description: 'PR branch prefix'
        required: true
        type: string
      pr_title:
        description: 'Pull request title'
        required: true
        type: string
      pr_message:
        description: 'Pull request message'
        required: true
        type: string
      commit_message:
        description: 'Commit message'
        required: true
        type: string
      base_image_url:
        description: 'Base bench image URL'
        required: false
        type: string
        default: 'us-docker.pkg.dev/grafanalabs-global/docker-grafana-bench-prod/grafana-bench'
      playwright_image_url:
        description: 'Playwright bench image URL'
        required: false
        type: string
        default: 'us-docker.pkg.dev/grafanalabs-global/docker-grafana-bench-prod/grafana-bench-playwright'

jobs:
  update-libsonnet:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install development dependencies
        run: make install-deps

      - name: Generate libsonnet
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Debug: Check what's available
          echo "🔍 Checking Go and PATH:"
          which go || echo "Go not found"
          go version || echo "Go version failed"
          echo "PATH: $PATH"
          
          # Generate main libsonnet files with unit tests using make
          make libsonnet-release VERSION="$VERSION"

      - name: Prepare libsonnet for deployment
        env:
          VERSION: ${{ inputs.version }}
          TARGET_DIR: ${{ inputs.target_dir }}
        run: |
          mkdir -p deployment-libsonnet
          
          echo "📋 Copying libsonnet function files..."
          cp libsonnet/main.libsonnet deployment-libsonnet/main.libsonnet
          cp libsonnet/main_test.jsonnet deployment-libsonnet/main_test.jsonnet
          
          echo "📝 Generating versions.libsonnet dynamically..."
          
          # Use the versions subcommand to generate versions.libsonnet
          # First, discover existing versions in deployment_tools (this will be done by the updater)
          # For now, we'll generate a basic versions file and let the deployment script update it
          
          if [ "$VERSION" = "experimental" ]; then
            echo "Creating versions.libsonnet for experimental deployment..."
            go run ./generators/libsonnet versions --versions "experimental" -o deployment-libsonnet
          else
            echo "Creating versions.libsonnet for versioned release $VERSION..."  
            # Include both experimental and the new version
            go run ./generators/libsonnet versions --versions "experimental,$VERSION" -o deployment-libsonnet
          fi
          
          echo "✅ Libsonnet function files ready for deployment to ${TARGET_DIR}"

      - name: Get Vault secrets for deployment_tools access
        uses: grafana/shared-workflows/actions/get-vault-secrets@ae92934a14a48b94494dbc06d74a81d47fe08a40
        with:
          common_secrets: |
            GITHUB_APP_ID=updater-app:app-id
            GITHUB_APP_INSTALLATION_ID=updater-app:app-installation-id
            GITHUB_APP_PRIVATE_KEY=updater-app:private-key

      - name: Authenticate with GAR for updater Docker image
        uses: grafana/shared-workflows/actions/login-to-gar@ae92934a14a48b94494dbc06d74a81d47fe08a40
        with:
          registry: us-docker.pkg.dev

      - name: Update deployment_tools with libsonnet
        env:
          VERSION: ${{ inputs.version }}
          TARGET_DIR: ${{ inputs.target_dir }}
          BRANCH_PREFIX: ${{ inputs.branch_prefix }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_MESSAGE: ${{ inputs.pr_message }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
          PR_REVIEWER: ${{ github.actor }}
        run: |
          set -euo pipefail
          
          # Pull the updater Docker image
          docker pull us-docker.pkg.dev/grafanalabs-global/docker-deployment-tools-prod/updater
          
          # Create config.json for libsonnet update using environment variables
          cat << EOF > config.json
          {
            "repo_owner": "grafana",
            "repo_name": "deployment_tools", 
            "destination_branch": "master",
            "pull_request_enabled": true,
            "pull_request_branch_prefix": "${BRANCH_PREFIX}",
            "pull_request_existing_strategy": "ignore",
            "pull_request_title": "${PR_TITLE}",
            "pull_request_message": "${PR_MESSAGE}",
            "pull_request_reviewers": ["${PR_REVIEWER}"],
            "pull_request_assignees": ["${PR_REVIEWER}"],
            "commit_message": "${COMMIT_MESSAGE}",
            "pre_update_commands": [
              {
                "description": "Create directory structure for bench libsonnet",
                "command": "mkdir -p ksonnet/lib/bench/${TARGET_DIR}"
              },
              {
                "description": "Copy libsonnet main function file",
                "command": "cp /workspace/libsonnet/main.libsonnet ksonnet/lib/bench/${TARGET_DIR}/main.libsonnet"
              },
              {
                "description": "Copy libsonnet test file", 
                "command": "cp /workspace/libsonnet/main_test.jsonnet ksonnet/lib/bench/${TARGET_DIR}/main_test.jsonnet"
              },
              {
                "description": "Dynamically discover existing versions and generate versions.libsonnet",
                "command": "cd ksonnet/lib/bench && existing_versions=$(find . -maxdepth 1 -type d -not -name '.' | sed 's|./||' | sort | paste -sd,) && if [ '${VERSION}' != 'experimental' ]; then if [ -z \"$existing_versions\" ]; then all_versions='${VERSION}'; else all_versions=\"$existing_versions,${VERSION}\"; fi; else all_versions=\"$existing_versions\"; fi && echo \"Discovered versions: $all_versions\" && cp /workspace/libsonnet/versions.libsonnet versions.libsonnet && cp /workspace/libsonnet/versions_test.jsonnet versions_test.jsonnet"
              }
            ]
          }
          EOF

          # Run the Docker-based updater tool
          docker run --rm \
            -v "$(pwd)/deployment-libsonnet:/workspace/libsonnet:ro" \
            -e GITHUB_APP_ID="$GITHUB_APP_ID" \
            -e GITHUB_APP_INSTALLATION_ID="$GITHUB_APP_INSTALLATION_ID" \
            -e GITHUB_APP_PRIVATE_KEY="$GITHUB_APP_PRIVATE_KEY" \
            -e CONFIG_JSON="$(cat config.json)" \
            us-docker.pkg.dev/grafanalabs-global/docker-deployment-tools-prod/updater |& tee updater-output.log

          echo "Libsonnet update completed for ${VERSION}!"