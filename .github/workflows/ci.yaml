name: publish-bench-image

# These permissions are needed to assume roles from Github's OIDC.
permissions:
  contents: read
  id-token: write

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  test-bench:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '>=1.21.x'

    - name: Set up k6
      run: go install go.k6.io/k6@latest

    - name: Test
      run: go test -v ./...

    - name: Build
      run: go build -v ./...

  test-container:
    runs-on: ubuntu-latest
    # run local registry that buildx can push to
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      DOCKER_CLI_EXPERIMENTAL: enabled
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: build container
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: |-
            BENCH_REVISION=${{ github.sha }}
          load: true
          tags: localhost:5000/grafana-bench-test:latest
      - name: check k6 browser dependencies
        run: |
          docker run --rm --entrypoint='k6' \
            --volume="./CI/:/CI/" --volume="./screenshots:/home/bench/screenshots/" \
            localhost:5000/grafana-bench-test:latest run /CI/browser_test.js
      - name: archive screenshots
        uses: actions/upload-artifact@v3
        with:
          name: screenshots
          path: screenshots

  publish-gar-dev:
    # publish to dev latest from main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-bench, test-container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/shared-workflows/actions/push-to-gar-docker@main
        id: push-to-gar
        with:
          environment: "dev"
          image_name: grafana-bench
          platforms: |-
            "linux/amd64"
            "linux/arm64"
          build-args: |-
            BENCH_REVISION=${{ github.sha }}
          tags: |-
            ${{ github.sha }}
            "latest"

  publish-gar-prod:
    # publish to prod only tagged versions
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [test-bench, test-container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/shared-workflows/actions/push-to-gar-docker@main
        id: push-to-gar
        with:
          environment: "prod"
          image_name: grafana-bench
          platforms: |-
            "linux/amd64"
            "linux/arm64"
          build-args: |-
            BENCH_REVISION=${{ github.sha }}
          tags: |-
            ${{ github.ref_name }}

  publish-ghcr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-bench, test-container]
    runs-on: ubuntu-latest
    steps:
      - name: get version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              IMAGE_VERSION=$GITHUB_REF_NAME
          else
              IMAGE_VERSION="latest"
          fi
          echo "image=${IMAGE_VERSION}" > $GITHUB_OUTPUT
      - name: checkout code
        uses: actions/checkout@v4
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3
      - name: Log into ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          push: true
          platforms: |-
            "linux/amd64"
            "linux/arm64"
          tags: |-
             ${{ steps.version.outputs.image }}
 