name: publish-bench-image

# These permissions are needed to assume roles from Github's OIDC.
permissions:
  contents: read
  id-token: write

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  test-bench:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '>=1.21.x'

    - name: Set up k6
      run: go install go.k6.io/k6@latest

    - name: Test
      run: go test -v ./...

    - name: Build
      run: go build -v ./...

  test-container:
    runs-on: ubuntu-latest
    # run local registry that buildx can push to
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      DOCKER_CLI_EXPERIMENTAL: enabled
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - name: build container
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: |-
            BENCH_REVISION=${{ github.sha }}
          load: true
          tags: localhost:5000/grafana-bench-test:latest
      - name: check k6 browser
        run: |
          docker run --rm --entrypoint='k6' \
            --volume="./CI/:/CI/" --volume="./screenshots:/home/bench/screenshots/" \
            localhost:5000/grafana-bench-test:latest run /CI/browser_test.js
      - name: archive screenshots
        uses: actions/upload-artifact@v3
        with:
          name: screenshots
          path: screenshots

  # publish as latest in dev
  publish-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-bench, test-container]
    runs-on: ubuntu-latest
    env:
      DOCKER_CLI_EXPERIMENTAL: enabled
    steps:
      - name: Docker Login (GCR)
        uses: docker/login-action@v3
        with:
          registry: us.gcr.io
          username: _json_key
          password: ${{ secrets.GCP_CONTAINERS_SA_JSON }}
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: build container
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64 #,linux/arm64
          build-args: |-
            BENCH_REVISION=${{ github.sha }}
          push: true
          tags: |
            us.gcr.io/kubernetes-dev/grafana-bench:latest

  publish-gar:
    # publish to prod only tagged versions
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [test-bench, test-container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/shared-workflows/actions/push-to-gar-docker@main
        id: push-to-gar
        with:
          environment: "prod"
          image_name: grafana-bench
          build-args: |-
            BENCH_REVISION=${{ github.sha }}
          tags: |-
            ${{ github.ref_name }}
