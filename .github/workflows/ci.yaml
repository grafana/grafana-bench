name: publish-bench-image

# These permissions are needed to assume roles from Github's OIDC.
permissions:
  contents: write
  id-token: write
  packages: write
  pull-requests: write

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  test-bench:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '>=1.21.x'

    - name: Set up k6
      run: go install go.k6.io/k6@latest

    - name: Test
      run: go test -v ./...

    - name: Build
      run: go build -v ./...

  test-container:
    runs-on: ubuntu-latest
    # run local registry that buildx can push to
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      DOCKER_CLI_EXPERIMENTAL: enabled
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: build container
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: |-
            BENCH_REVISION=${{ github.sha }}
          load: true
          tags: localhost:5000/grafana-bench-test:latest
      - name: check k6 browser dependencies
        run: |
          docker run --rm --entrypoint='k6' \
            --volume="./CI/:/CI/" --volume="./screenshots:/home/bench/screenshots/" \
            localhost:5000/grafana-bench-test:latest run /CI/browser_test.js
      - name: archive screenshots
        uses: actions/upload-artifact@v3
        with:
          name: screenshots
          path: screenshots

  update-docs:
    # run only when pushing to a PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '>=1.21.x'
      - name: check changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            cmds:
              - 'cmd/**'
      - name: gen docs
        if: steps.changes.outputs.cmds == 'true'
        run: |
          go run gendoc/main.go -o docs
      - name: commit updates
        uses: parkerbxyz/suggest-changes@v1
        with:
          comment: 'Please update documentation'

  publish-dev:
    # publish latest from main to dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-bench, test-container]
    runs-on: ubuntu-latest
    steps:
      - name: Log into ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - uses: grafana/shared-workflows/actions/push-to-gar-docker@main
        id: push-to-gar
        with:
          environment: "dev"
          image_name: grafana-bench
          platforms: linux/amd64,linux/arm64
          build-args: |-
            BENCH_REVISION=${{ github.sha }}
          tags: |-
            ${{ github.sha }}
            latest
      - name: copy image to ghcr.io
        run: |
          # this is a multi-line string, so just use the first
          GAR_IMAGE=$(echo "${{ steps.push-to-gar.outputs.tags }}" | head -n1)
          echo "GAR_IMAGE=$GAR_IMAGE"
          GHCR_IMAGE=ghcr.io/grafana/grafana-bench:${{ steps.push-to-gar.outputs.version }}
          echo "GHCR_IMAGE=$GHCR_IMAGE"

          docker buildx imagetools create \
            --tag $GHCR_IMAGE \
            $GAR_IMAGE

  publish-prod:
    # publish tagged versions to prod
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [test-bench, test-container]
    runs-on: ubuntu-latest
    steps:
      - name: Log into ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - uses: grafana/shared-workflows/actions/push-to-gar-docker@main
        id: push-to-gar
        with:
          environment: "prod"
          image_name: grafana-bench
          platforms: linux/amd64,linux/arm64
          build-args: |-
            BENCH_REVISION=${{ github.sha }}
          tags: |-
            ${{ github.ref_name }}
            ${{ github.sha }}
            latest
      - name: copy image to ghcr.io
        run: |
          # this is a multi-line string, so just use the first
          GAR_IMAGE=$(echo "${{ steps.push-to-gar.outputs.tags }}" | head -n1)
          echo "GAR_IMAGE=$GAR_IMAGE"

          GHCR_IMAGE=ghcr.io/grafana/grafana-bench:${{ steps.push-to-gar.outputs.version }}
          echo "GHCR_IMAGE=$GHCR_IMAGE"

          GHCR_IMAGE_LATEST=ghcr.io/grafana/grafana-bench:latest
          echo "GHCR_IMAGE_LATEST=$GHCR_IMAGE_LATEST"

          docker buildx imagetools create \
            --tag $GHCR_IMAGE --tag $GHCR_IMAGE_LATEST \
            $GAR_IMAGE
