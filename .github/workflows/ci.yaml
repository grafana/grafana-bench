name: publish-bench-image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: ./.github/actions/setup-k6

      - name: Test
        run: go test -v ./...

      - name: Build
        run: go build -v ./...

  test-binary:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    services:
      grafana:
        image: grafana/grafana:12.0.1
        ports:
          - 3000:3000
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: ./.github/actions/setup-k6

      - name: Install
        run: go install

      - id: get-secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@de81a07e6f6718fb289c7a4612c9c514c28bd798 #get-vault-secrets-v1.2.0
        with:
          # Secrets placed in the ci/repo/grafana/<repo>/<path> path in Vault
          repo_secrets: |
            SLACK_TOKEN=slack_token:slack_token

      - name: Test Slack Notifications
        env:
          TEST_SUITE_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grafana-bench test \
            --test-type smoke \
            --grafana-url http://localhost:3000 \
            --test-suite CI/k6 \
            --log-level info \
            --test-suite-revision ${{ github.sha }} \
            --test-report-format log \
            --test-suite-name grafana-bench/ci \
            --test-suite-repo https://github.com/grafana/grafana-bench.git \
            --test-suite-base /tmp/grafana-bench \
            --test-trigger grafana-bench-ci \
            --slack-notifications

  test-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    services:
      grafana:
        image: grafana/grafana:12.0.1
        ports:
          - 3000:3000
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.x'
          cache: false

      - name: Install
        run: go install

      - name: --slack-notifier-permissions Should fail with no slack token
        run: |
          if ! grafana-bench validate --slack-notifier-permissions; then
            echo "Command failed without token as expected"
          else
            echo "Command unexpectedly succeeded"
            exit 1
          fi

      - id: get-secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@de81a07e6f6718fb289c7a4612c9c514c28bd798 #get-vault-secrets-v1.2.0
        with:
          # Secrets placed in the ci/repo/grafana/<repo>/<path> path in Vault
          repo_secrets: |
            SLACK_TOKEN=slack_token:slack_token

      - name: --slack-notifier-permissions should pass
        env:
          TEST_SUITE_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grafana-bench validate --check-slack-permissions

      - name: --slack-notifier-permissions should fail if we don't have permissions on a channel
        run: |
          mv codeowners-mapping.yaml codeowners-mapping.yaml.tmp
          cat > codeowner-mapping.yaml << 'EOF'
          mapping:
            - slack_channel: "grafana-bench-private"
              github_team: "@grafana/grafana-developer-enablement-squad"
          EOF

          if ! grafana-bench validate --check-slack-permissions; then
            echo "Command failed as expected"
          else
            echo "Command unexpectedly succeeded"
            exit 1
          fi

  build-base-image:
    needs: [test-go, test-binary, test-validate]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-base-image.yml
    secrets:
      TEST_SUITE_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-playwright-image:
    needs: [test-go, test-binary, test-validate]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-playwright-image.yml

  test-setup-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Test setup-grafana-bench action with go install fallback
        uses: ./.github/actions/setup-grafana-bench
        with:
          version: 'v0.6.1'

      - name: Verify installation
        run: |
          grafana-bench version
          which grafana-bench

  # Generate and publish libsonnet libraries  
  update-experimental-libsonnet:
    needs: [build-base-image, build-playwright-image]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/update-libsonnet.yml
    with:
      version: "dev-latest"
      target_dir: "bench/experimental"
      branch_prefix: "bench-libsonnet-experimental"
      pr_title: "[Experimental] Update experimental bench libsonnet"
      pr_message: "Update experimental bench libsonnet from main branch\\n\\nThis PR updates the experimental bench libsonnet library with the latest changes from the main branch.\\n\\nChanges:\\n- Update ksonnet/lib/argo-workflows-util/common-steps/bench/experimental/bench.libsonnet\\n\\n⚠️ This is an experimental version - use for testing only.\\n\\nImport with:\\n```jsonnet\\nlocal bench = import 'argo-workflows-util/common-steps/bench/experimental/bench.libsonnet';\\n```"
      commit_message: "Update bench experimental libsonnet from main\\n\\nThis commit updates the experimental bench libsonnet library with the latest changes.\\n\\nGenerated automatically from bench CLI flags."
      download_url: "https://raw.githubusercontent.com/grafana/grafana-bench/main/libsonnet/bench.libsonnet"
      base_image_url: "us-docker.pkg.dev/grafanalabs-dev/docker-grafana-bench-dev/grafana-bench"
      playwright_image_url: "us-docker.pkg.dev/grafanalabs-dev/docker-grafana-bench-dev/grafana-bench-playwright"

  update-versioned-libsonnet:
    needs: [build-base-image, build-playwright-image]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/update-libsonnet.yml
    with:
      version: ${{ github.ref_name }}
      target_dir: "bench/${{ github.ref_name }}"
      branch_prefix: "bench-libsonnet-release"
      pr_title: "Add bench libsonnet ${{ github.ref_name }}"
      pr_message: "Add bench libsonnet ${{ github.ref_name }}\\n\\nThis PR adds the versioned libsonnet library for bench ${{ github.ref_name }}, generated automatically from the CLI flags.\\n\\nChanges:\\n- Add ksonnet/lib/argo-workflows-util/common-steps/bench/${{ github.ref_name }}/bench.libsonnet\\n\\nOnce this is merged, users can import the versioned library with:\\n```jsonnet\\nlocal bench = import 'argo-workflows-util/common-steps/bench/${{ github.ref_name }}/bench.libsonnet';\\n```"
      commit_message: "Add bench libsonnet ${{ github.ref_name }}\\n\\nThis commit adds the versioned bench libsonnet library.\\n\\nGenerated automatically from bench CLI flags."
      download_url: "https://github.com/grafana/grafana-bench/releases/download/${{ github.ref_name }}/bench.libsonnet"
