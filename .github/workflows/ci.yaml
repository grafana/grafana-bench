name: publish-bench-image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: ./.github/actions/setup-k6

      - name: Test
        run: go test -v ./...

      - name: Build
        run: go build -v ./...

  test-binary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    services:
      grafana:
        image: grafana/grafana:12.0.1
        ports:
          - 3000:3000
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: ./.github/actions/setup-k6

      - name: Install
        run: go install

      - id: get-secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@62722333225a1fae03ae27a63d638f9bc2176edb #get-vault-secrets-v1.2.0
        with:
          # Secrets placed in the ci/repo/grafana/<repo>/<path> path in Vault
          repo_secrets: |
            SLACK_TOKEN=slack_token:slack_token

      - name: Test Slack Notifications
        env:
          TEST_SUITE_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grafana-bench test \
            --test-type smoke \
            --grafana-url http://localhost:3000 \
            --test-suite CI/k6 \
            --log-level info \
            --test-suite-revision ${{ github.sha }} \
            --test-report-format log \
            --test-suite-name grafana-bench/ci \
            --test-suite-repo https://github.com/grafana/grafana-bench.git \
            --test-suite-base /tmp/grafana-bench \
            --test-trigger grafana-bench-ci \
            --slack-notifications

  test-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    services:
      grafana:
        image: grafana/grafana:12.0.1
        ports:
          - 3000:3000
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.x'
          cache: false

      - name: Install
        run: go install

      - name: --slack-notifier-permissions Should fail with no slack token
        run: |
          if ! grafana-bench validate --slack-notifier-permissions; then
            echo "Command failed without token as expected"
          else
            echo "Command unexpectedly succeeded"
            exit 1
          fi

      - id: get-secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@62722333225a1fae03ae27a63d638f9bc2176edb #get-vault-secrets-v1.2.0
        with:
          # Secrets placed in the ci/repo/grafana/<repo>/<path> path in Vault
          repo_secrets: |
            SLACK_TOKEN=slack_token:slack_token

      - name: --slack-notifier-permissions should pass
        env:
          TEST_SUITE_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grafana-bench validate --check-slack-permissions

      - name: --slack-notifier-permissions should fail if we don't have permissions on a channel
        run: |
          mv codeowners-mapping.yaml codeowners-mapping.yaml.tmp
          cat > codeowner-mapping.yaml << 'EOF'
          mapping:
            - slack_channel: "grafana-bench-private"
              github_team: "@grafana/grafana-developer-enablement-squad"
          EOF

          if ! grafana-bench validate --check-slack-permissions; then
            echo "Command failed as expected"
          else
            echo "Command unexpectedly succeeded"
            exit 1
          fi

  build-base-image:
    needs: [test-go, test-binary, test-validate]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-base-image.yml
    secrets:
      TEST_SUITE_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-playwright-image:
    needs: [test-go, test-binary, test-validate]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-playwright-image.yml
