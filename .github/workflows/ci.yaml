name: publish-bench-image

# These permissions are needed to assume roles from Github's OIDC.
permissions:
  contents: read
  id-token: write

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  test-bench:
    runs-on: ubuntu-latest
    services:
      grafana:
        image: grafana/grafana:latest
        ports:
          - 3000:3000
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.x'
          cache: false

      - name: Set up k6
        run: go install go.k6.io/k6@latest

      - name: Test
        run: go test -v ./...

      - name: Build
        run: go build -v ./...

      - name: Install
        run: go install

      - id: get-secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@get-vault-secrets-v1.2.0
        with:
          # Secrets placed in the ci/repo/grafana/<repo>/<path> path in Vault
          repo_secrets: |
            SLACK_TOKEN=slack_token-actions:slack_token

      - name: Test Slack Notifications
        env:
          TEST_SUITE_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grafana-bench test \
            --test-type smoke \
            --grafana-url http://localhost:3000 \
            --test-suite CI/k6 \
            --log-level info \
            --test-suite-revision ${{ github.sha }} \
            --test-report-format log \
            --test-suite-name grafana-bench/ci \
            --test-suite-repo https://github.com/grafana/grafana-bench.git \
            --test-suite-base /tmp/grafana-bench \
            --test-trigger grafana-bench-ci \
            --slack-notifications

  test-container:
    runs-on: ubuntu-latest
    # run local registry that buildx can push to
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
      grafana:
        image: grafana/grafana:latest
        ports:
          - 3000:3000

    env:
      DOCKER_CLI_EXPERIMENTAL: enabled
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: build container
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          build-args: |-
            BENCH_REVISION=${{ github.sha }}
          load: true
          tags: localhost:5000/grafana-bench-test:latest

      - name: check k6 browser dependencies
        run: |
          docker run --rm \
            --entrypoint='k6' \
            --volume="./CI/:/CI/" \
            --volume="./screenshots:/home/bench/screenshots/" \
            localhost:5000/grafana-bench-test:latest run /CI/k6/verify_k6_browser_deps.js

      - name: check Grafana instance
        run: |
          curl http://localhost:3000
          #RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)
          #echo $response
          #if [ $RESPONSE -ne 200 ]; then
          #  sleep 5;
          #  echo "Grafana is not accessible"
          #  exit 1
          #fi

      - name: check playwright test
        run: |
          docker run --rm --network=host --volume="./CI/:/home/bench/tests/CI/" \
            localhost:5000/grafana-bench-test:latest test \
              --config "/home/bench/tests/CI/playwright.yaml"

      - name: archive screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots

  publish-dev:
    # publish latest from main to dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-bench, test-container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: get short sha
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c 1-7)" >> $GITHUB_ENV
      - name: Log into ghcr.io
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: grafana/shared-workflows/actions/push-to-gar-docker@de81a07e6f6718fb289c7a4612c9c514c28bd798 # v0.4.1
        id: push-to-gar
        with:
          environment: "dev"
          image_name: grafana-bench
          platforms: linux/amd64,linux/arm64
          build-args: |-
            BENCH_REVISION=${{ env.SHORT_SHA }}
          tags: |-
            ${{ env.SHORT_SHA }}
            latest
      - name: copy image to ghcr.io
        run: |
          # this is a multi-line string, so just use the first
          GAR_IMAGE=$(echo "${{ steps.push-to-gar.outputs.tags }}" | head -n1)
          echo "GAR_IMAGE=$GAR_IMAGE"
          GHCR_IMAGE=ghcr.io/grafana/grafana-bench:${{ steps.push-to-gar.outputs.version }}
          echo "GHCR_IMAGE=$GHCR_IMAGE"

          docker buildx imagetools create \
            --tag $GHCR_IMAGE \
            $GAR_IMAGE

  publish-prod:
    # publish tagged versions to prod
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [test-bench, test-container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Log into ghcr.io
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: grafana/shared-workflows/actions/push-to-gar-docker@de81a07e6f6718fb289c7a4612c9c514c28bd798 # v0.4.1
        id: push-to-gar
        with:
          environment: "prod"
          image_name: grafana-bench
          platforms: linux/amd64,linux/arm64
          build-args: |-
            BENCH_REVISION=${{ github.ref_name }}
          tags: |-
            ${{ github.ref_name }}
            ${{ github.sha }}
            latest
      - name: copy image to ghcr.io
        run: |
          # this is a multi-line string, so just use the first
          GAR_IMAGE=$(echo "${{ steps.push-to-gar.outputs.tags }}" | head -n1)
          echo "GAR_IMAGE=$GAR_IMAGE"

          GHCR_IMAGE=ghcr.io/grafana/grafana-bench:${{ steps.push-to-gar.outputs.version }}
          echo "GHCR_IMAGE=$GHCR_IMAGE"

          GHCR_IMAGE_LATEST=ghcr.io/grafana/grafana-bench:latest
          echo "GHCR_IMAGE_LATEST=$GHCR_IMAGE_LATEST"

          docker buildx imagetools create \
            --tag $GHCR_IMAGE --tag $GHCR_IMAGE_LATEST \
            $GAR_IMAGE
