name: manual argo trigger

on:
  workflow_dispatch:

jobs:
  trigger-argo-workflow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: setup argo
        uses: grafana/shared-workflows/actions/setup-argo@ae92934a14a48b94494dbc06d74a81d47fe08a40

      - name: trigger grafana-bench-cd workflow
        id: trigger-workflow
        uses: grafana/shared-workflows/actions/trigger-argo-workflow@ae92934a14a48b94494dbc06d74a81d47fe08a40
        with:
          instance: "ops"
          namespace: "grafana-bench-cd"
          workflow_template: "grafana-bench-cd"
          extra_args: ""

      - name: monitor workflow status
        run: |
          WORKFLOW_URI="${{ steps.trigger-workflow.outputs.uri }}"
          echo "Workflow URI: $WORKFLOW_URI"
          
          # Extract workflow name from URI
          WORKFLOW_NAME=$(echo "$WORKFLOW_URI" | sed 's/.*\/workflows\///' | cut -d'?' -f1)
          echo "Monitoring workflow: $WORKFLOW_NAME"
          
          # Poll workflow status until completion (30 minute timeout)
          for i in {1..60}; do
            STATUS=$(curl -s -H "Authorization: Bearer ${{ env.ARGO_TOKEN }}" \
              https://argo-workflows.grafana.net/api/v1/workflows/grafana-bench-cd/$WORKFLOW_NAME | \
              jq -r '.status.phase // "Unknown"')
            
            echo "Attempt $i: $STATUS"
            
            case "$STATUS" in
              "Succeeded")
                echo "✅ Workflow completed successfully"
                exit 0
                ;;
              "Failed"|"Error")
                echo "❌ Workflow failed"
                exit 1
                ;;
              "Running"|"Pending"|"Unknown")
                echo "⏳ Workflow still running, waiting 30 seconds..."
                sleep 30
                ;;
              *)
                echo "⚠️ Unknown status: $STATUS, waiting 30 seconds..."
                sleep 30
                ;;
            esac
          done
          
          echo "⏰ Workflow monitoring timeout after 30 minutes"
          exit 1