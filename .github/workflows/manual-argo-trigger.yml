name: manual argo trigger

on:
  workflow_dispatch:

jobs:
  trigger-argo-workflow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: setup argo
        uses: grafana/shared-workflows/actions/setup-argo@ae92934a14a48b94494dbc06d74a81d47fe08a40

      - name: trigger grafana-bench-cd workflow
        uses: grafana/shared-workflows/actions/trigger-argo-workflow@ae92934a14a48b94494dbc06d74a81d47fe08a40
        with:
          instance: "ops"
          namespace: "grafana-bench-cd"
          workflow_template: "grafana-bench-cd"
          extra_args: ""