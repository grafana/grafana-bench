version: 2
updates:
- package-ecosystem: gomod
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "13:00"
    timezone: UTC
  open-pull-requests-limit: 10
- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "13:00"
    timezone: UTC
  open-pull-requests-limit: 10
  # Enable updates for Grafana Docker images
  ignore:
    - dependency-name: "*"
      update-types: ["version-update:semver-major"]
  groups:
    grafana:
      patterns:
        - "grafana/grafana"
        - "grafana/k6"
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "13:00"
    timezone: UTC
  open-pull-requests-limit: 10
