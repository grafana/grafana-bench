version: 2
updates:
- package-ecosystem: gomod
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "13:00"
    timezone: UTC
  open-pull-requests-limit: 10
- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "13:00"
    timezone: UTC
  open-pull-requests-limit: 10
  # Group Grafana Docker images together
  groups:
    grafana:
      patterns:
        - "grafana/grafana"
        - "grafana/k6"
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "13:00"
    timezone: UTC
  open-pull-requests-limit: 10
