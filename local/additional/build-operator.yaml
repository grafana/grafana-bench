apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: build-operator
rules:
  - apiGroups:
      - grafana-bench-app.ext.grafana.com
    resources:
      - jobs
    verbs:
      - create
      - update
      - patch
      - delete
      - deletecollection
      - get
      - list
      - watch
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - update
      - patch
      - delete
      - deletecollection
      - get
      - list
      - watch
  - apiGroups:
    - ""
    resources:
      - pods 
      - pods/log
    verbs:
      - create
      - update
      - patch
      - delete
      - deletecollection
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana:build-operator-rolebinding
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: build-operator
subjects:
  - kind: ServiceAccount
    name: operator
    namespace: default
